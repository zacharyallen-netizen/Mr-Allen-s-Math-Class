<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NC Math 1 — Password Required</title>
<link href="https://fonts.googleapis.com/css2?family=Arvo:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
.gate-wrap{max-width:440px;margin:8vh auto;padding:0 16px;}
.gate-card{background:var(--card);border:1px solid var(--border);border-top:5px solid var(--gold);border-radius:var(--radius);padding:28px 26px;text-align:center;box-shadow:0 8px 26px rgba(30,45,79,.12);}
.gate-card h1{font-family:var(--font-head);color:var(--navy);font-size:1.5rem;margin:6px 0 4px;}
.gate-card p{color:var(--muted);font-size:.95rem;margin:0 0 18px;}
.gate-card input{width:100%;padding:11px 14px;border:2px solid #cdd5e0;border-radius:8px;font-size:1rem;font-family:var(--font-body);margin-bottom:12px;text-align:center;}
.gate-card input:focus{outline:none;border-color:var(--royal);}
.gate-btn{width:100%;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:11px;font-weight:700;font-size:1rem;cursor:pointer;font-family:var(--font-body);}
.gate-btn:hover{background:#16203a;}
.gate-err{color:var(--red);font-size:.9rem;font-weight:600;min-height:1.2em;margin-top:10px;}
.gate-icon{font-size:2.4rem;}
.gate-home{display:inline-block;margin-top:16px;color:var(--royal);text-decoration:none;font-size:.88rem;font-weight:600;}
.gate-home:hover{text-decoration:underline;}
</style>
</head>
<body>
<script src="../site-bar.js"></script>
<div class="gate-wrap">
  <div class="gate-card">
    <div class="gate-icon">🔒</div>
    <h1>NC Math 1</h1>
    <p>This section is password-protected. Please enter the class password to continue.</p>
    <input type="password" id="pw" placeholder="Class password" onkeydown="if(event.key==='Enter')checkPw()" autofocus>
    <button class="gate-btn" onclick="checkPw()">Enter</button>
    <div class="gate-err" id="err"></div>
    <a class="gate-home" href="../index.html">← Back to Mr. Allen's Home</a>
  </div>
</div>
<script>
// Class gate. A mild deterrent, not real security: the pages are still public.
// Only a SHA-256 fingerprint of the password is stored here, never the password itself.
// To change the password, see "THE MATH 1 PASSWORD" in HOW_TO_UPDATE.txt.
var PW_HASH = "3fe871d2793097033e0d033fce63d7ec701e5bfc0d4aadb94439ec90a55b48d1";
var STRIKES = 3;                       // wrong tries before the alarm
function sha256(t){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)).then(function(b){
    return Array.prototype.map.call(new Uint8Array(b), function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
  });
}
function fails(n){ try{ if(n != null) localStorage.setItem('m1fails', String(n)); return Number(localStorage.getItem('m1fails') || 0); }catch(e){ return n || 0; } }
function checkPw(){
  var box = document.getElementById('pw'), v = box.value.trim().toLowerCase();
  if(!v){ box.focus(); return; }
  sha256(v).then(function(h){
    if(h === PW_HASH){
      fails(0);
      try{ sessionStorage.setItem('m1ok','1'); }catch(e){}
      var dest = sessionStorage.getItem('m1dest') || 'index.html';
      sessionStorage.removeItem('m1dest');
      window.location.replace(dest);
      return;
    }
    var n = fails(fails() + 1);
    box.value = "";
    if(n >= STRIKES){ fails(0); MathAlarm.go(); return; }
    document.getElementById('err').textContent = "Incorrect password — " + (STRIKES - n) + (STRIKES - n === 1 ? " try left." : " tries left.");
    box.focus();
  });
}

/* ---- Teacher tool: open gate.html#new-password to get the fingerprint for a new password ---- */
if (location.hash === '#new-password') {
  var card = document.querySelector('.gate-card');
  card.innerHTML = '<h1>New Math 1 password</h1><p>Type the new password. Copy the long code it makes, and paste it into math1/gate.html after PW_HASH (or send it to Claude).</p>' +
    '<input id="np" type="text" placeholder="New password" autocomplete="off"><button class="gate-btn" id="mk">Make the code</button>' +
    '<p id="out" style="word-break:break-all;font-family:monospace;margin-top:14px;color:#1E2D4F"></p>';
  document.getElementById('mk').onclick = function(){ var t = document.getElementById('np').value.trim().toLowerCase(); if(t) sha256(t).then(function(h){ document.getElementById('out').textContent = h; }); };
}

/* ---- The Math Alarm: silly, loud, and impossible to skip for 12 seconds ---- */
var MathAlarm = (function(){
  var ac, nodes = [], timer;
  var LINES = [
    "Unauthorized number cruncher detected.",
    "Your calculator has been reported to the Bureau of Unsolved Equations.",
    "A team of angry protractors is on the way.",
    "Please remain seated and recite the multiplication table of 7.",
    "Your pencil's eraser has been placed on probation.",
    "The variable x has been notified. It is not happy.",
    "Mr. Allen has been alerted. He is making a disappointed face."
  ];
  function siren(){
    try{
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if(ac.state === 'suspended') ac.resume();
      var g = ac.createGain(); g.gain.value = 0.18; g.connect(ac.destination);
      var o = ac.createOscillator(); o.type = 'square'; o.frequency.value = 650; o.connect(g);
      var lfo = ac.createOscillator(); lfo.type = 'triangle'; lfo.frequency.value = 1.6;   // wee-woo sweep
      var depth = ac.createGain(); depth.gain.value = 260; lfo.connect(depth); depth.connect(o.frequency);
      var o2 = ac.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 330; var g2 = ac.createGain(); g2.gain.value = 0.06; o2.connect(g2); g2.connect(ac.destination);
      var honk = ac.createOscillator(); honk.type = 'square'; honk.frequency.value = 3; var hg = ac.createGain(); hg.gain.value = 0.05; honk.connect(hg); hg.connect(g2.gain);
      [o, lfo, o2, honk].forEach(function(n){ n.start(); });
      nodes = [o, lfo, o2, honk];
    }catch(e){}
  }
  function hush(){ nodes.forEach(function(n){ try{ n.stop(); }catch(e){} }); nodes = []; }
  function go(){
    var ov = document.getElementById('alarm');
    if(!ov){
      ov = document.createElement('div'); ov.id = 'alarm'; ov.setAttribute('role','alertdialog'); ov.setAttribute('aria-modal','true'); ov.setAttribute('aria-labelledby','al-h');
      ov.innerHTML = '<div class="al-box"><div class="al-light" aria-hidden="true"></div><h2 id="al-h">MATH ALERT</h2>' +
        '<p class="al-big">Three wrong passwords!</p><p class="al-line" id="al-line" aria-live="assertive"></p>' +
        '<p class="al-count">Dispatching protractors in <b id="al-n">12</b></p>' +
        '<button type="button" id="al-ok" disabled>I promise to ask Mr. Allen for the password</button></div>';
      document.body.appendChild(ov);
      document.getElementById('al-ok').addEventListener('click', function(){ hush(); clearInterval(timer); ov.hidden = true; document.getElementById('err').textContent = "Ask Mr. Allen for the class password."; document.getElementById('pw').focus(); });
    }
    ov.hidden = false;
    var ok = document.getElementById('al-ok'); ok.disabled = true;
    var left = 12, i = 0, lineEl = document.getElementById('al-line'), nEl = document.getElementById('al-n');
    lineEl.textContent = LINES[0]; nEl.textContent = left;
    siren();
    clearInterval(timer);
    timer = setInterval(function(){
      left--; i++;
      nEl.textContent = Math.max(left, 0);
      if(i % 2 === 0) lineEl.textContent = LINES[(i / 2) % LINES.length];
      if(left <= 0){ ok.disabled = false; ok.focus(); document.querySelector('.al-count').textContent = 'Just kidding. Nobody is coming. But the siren keeps going until you click the button.'; clearInterval(timer); }
    }, 1000);
  }
  return { go: go, stop: hush };
})();
</script>
<style>
#alarm{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;background:#7F1D1D;animation:alPulse 1.4s ease-in-out infinite}
#alarm[hidden]{display:none}
@keyframes alPulse{0%,100%{background:#7F1D1D}50%{background:#DC2626}}
.al-box{max-width:520px;width:100%;background:#fff;border-radius:14px;padding:22px 20px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.4);animation:alShake .5s ease-in-out infinite}
@keyframes alShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.2deg)}75%{transform:rotate(1.2deg)}}
.al-light{width:64px;height:64px;margin:0 auto 6px;border-radius:50% 50% 8px 8px;background:radial-gradient(circle at 40% 35%,#FCA5A5,#DC2626 60%);box-shadow:0 0 30px 10px rgba(220,38,38,.6);animation:alSpin 0.8s linear infinite}
@keyframes alSpin{0%,100%{box-shadow:-20px 0 30px 6px rgba(220,38,38,.7)}50%{box-shadow:20px 0 30px 6px rgba(37,99,235,.7)}}
#al-h{font:800 2.1rem/1.1 Inter,sans-serif;color:#B91C1C;letter-spacing:.08em;margin:4px 0}
.al-big{font:700 1.15rem Inter,sans-serif;color:#1E2D4F;margin:4px 0 8px}
.al-line{font:600 1.05rem/1.4 Inter,sans-serif;color:#7F1D1D;min-height:2.8em;margin:0 0 8px}
.al-count{font:500 .98rem Inter,sans-serif;color:#1E2D4F;margin:0 0 14px}
.al-count b{font:700 1.4rem "JetBrains Mono",monospace;color:#B91C1C}
#al-ok{width:100%;min-height:48px;border:0;border-radius:8px;background:#1E2D4F;color:#fff;font:700 1rem Inter,sans-serif;cursor:pointer}
#al-ok:disabled{background:#9CA3AF;cursor:not-allowed}
#al-ok:focus-visible{outline:3px solid #FFC107;outline-offset:2px}
@media (prefers-reduced-motion:reduce){#alarm,.al-box,.al-light{animation:none}}
</style>
</body>
</html>
