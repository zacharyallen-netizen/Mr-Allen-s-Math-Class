<script>
(function () {
  var cv = document.getElementById('cv'), cx = cv.getContext('2d'), W = 0, H = 0;
  function size() { var d = Math.min(2, devicePixelRatio || 1), r = cv.getBoundingClientRect(); W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); }
  addEventListener('resize', size);
  var S = { q: null, depth: 0, show: 0, crit: [], bub: [], ping: 0, bad: 0 };
  for (var i = 0; i < 40; i++) S.bub.push({ x: Math.random(), y: Math.random(), r: Math.random() * 3 + 1, v: Math.random() * .4 + .2 });
  var KINDS = ['fish', 'fish', 'jelly', 'fish', 'jelly', 'squid', 'angler', 'angler'];
  var F = function (px, w) { return (w || 600) + ' ' + Math.round(px) + 'px JetBrains Mono, monospace'; };

  function creature(c, t) {
    var x = c.x * W + Math.sin(t / 1800 + c.ph) * W * .05, y = c.y * H + Math.sin(t / 900 + c.ph) * 6, s = c.s * Math.max(10, W / 60);
    cx.save(); cx.translate(x, y); cx.globalAlpha = .85;
    if (c.k === 'fish') { cx.scale(c.dir, 1); cx.fillStyle = c.col; cx.beginPath(); cx.ellipse(0, 0, s * 1.4, s * .7, 0, 0, 7); cx.fill(); cx.beginPath(); cx.moveTo(-s * 1.2, 0); cx.lineTo(-s * 2.1, -s * .7 + Math.sin(t / 150) * 2); cx.lineTo(-s * 2.1, s * .7); cx.fill(); cx.fillStyle = '#021018'; cx.beginPath(); cx.arc(s * .8, -s * .15, s * .16, 0, 7); cx.fill(); }
    else if (c.k === 'jelly') { cx.fillStyle = c.col; cx.shadowColor = c.col; cx.shadowBlur = 12; cx.beginPath(); cx.arc(0, 0, s, Math.PI, 0); cx.fill(); cx.strokeStyle = c.col; cx.lineWidth = 2; for (var k = -2; k <= 2; k++) { cx.beginPath(); cx.moveTo(k * s * .35, 0); cx.quadraticCurveTo(k * s * .35 + Math.sin(t / 300 + k) * 6, s * 1.2, k * s * .35, s * 2.2); cx.stroke(); } }
    else if (c.k === 'squid') { cx.fillStyle = c.col; cx.beginPath(); cx.ellipse(0, -s * .4, s * .7, s * 1.3, 0, 0, 7); cx.fill(); cx.strokeStyle = c.col; cx.lineWidth = 3; for (k = -3; k <= 3; k++) { cx.beginPath(); cx.moveTo(k * s * .2, s * .7); cx.quadraticCurveTo(k * s * .5, s * 1.6 + Math.sin(t / 250 + k) * 5, k * s * .3, s * 2.4); cx.stroke(); } }
    else { cx.scale(c.dir, 1); cx.fillStyle = '#2a3348'; cx.beginPath(); cx.ellipse(0, 0, s * 1.5, s * 1.1, 0, 0, 7); cx.fill(); cx.strokeStyle = '#4a5878'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(s * .6, -s * .9); cx.quadraticCurveTo(s * 1.6, -s * 2.2, s * 2.1, -s * 1.3); cx.stroke();
      cx.fillStyle = '#fff6b0'; cx.shadowColor = '#fff6b0'; cx.shadowBlur = 20; cx.beginPath(); cx.arc(s * 2.1, -s * 1.3, s * .3, 0, 7); cx.fill(); cx.shadowBlur = 0; cx.fillStyle = '#fff'; for (k = 0; k < 4; k++) { cx.beginPath(); cx.moveTo(s * (.6 + k * .2), s * .2); cx.lineTo(s * (.7 + k * .2), s * .45); cx.lineTo(s * (.8 + k * .2), s * .2); cx.fill(); } }
    cx.restore();
  }
  function sub(t) {
    var x = W * .1, y = H * .16 + Math.sin(t / 700) * 4, s = Math.max(14, W / 40);
    cx.save(); cx.translate(x, y);
    var g = cx.createLinearGradient(0, -s, 0, s); g.addColorStop(0, '#ffd54a'); g.addColorStop(1, '#c79400');
    cx.fillStyle = g; cx.beginPath(); cx.ellipse(0, 0, s * 1.8, s * .8, 0, 0, 7); cx.fill(); cx.fillRect(-s * .3, -s * 1.3, s * .9, s * .6);
    cx.fillStyle = '#7fe6ff'; [-.8, 0, .8].forEach(function (k) { cx.beginPath(); cx.arc(k * s, 0, s * .25, 0, 7); cx.fill(); });
    cx.fillStyle = '#8a6a00'; cx.beginPath(); cx.moveTo(-s * 1.8, 0); cx.lineTo(-s * 2.4, -s * .6); cx.lineTo(-s * 2.4, s * .6); cx.fill();
    cx.fillStyle = 'rgba(255,250,200,.12)'; cx.beginPath(); cx.moveTo(s * 1.7, 0); cx.lineTo(W * .3, -s * 2); cx.lineTo(W * .3, s * 2.5); cx.fill();
    cx.restore();
  }
  /* ---------- sonar screen: the data ---------- */
  function sonar(rep, t) {
    var bx = W * .3, by = H * .08, bw = W * .66, bh = H * .62;
    cx.fillStyle = 'rgba(1,20,24,.88)'; cx.strokeStyle = S.bad > 0 ? 'rgba(255,93,115,' + (.4 + S.bad * .6) + ')' : 'rgba(92,255,208,.55)'; cx.lineWidth = 2; rr(bx, by, bw, bh, 14); cx.fill(); cx.stroke();
    cx.fillStyle = 'rgba(92,255,208,.06)'; for (var y = by + ((t / 50) % 5); y < by + bh; y += 5) cx.fillRect(bx, y, bw, 1);
    if (S.ping > 0) { cx.strokeStyle = 'rgba(92,255,208,' + S.ping + ')'; cx.lineWidth = 2; cx.beginPath(); cx.arc(bx + bw / 2, by + bh / 2, (1 - S.ping) * bw * .6, 0, 7); cx.stroke(); S.ping -= .02; }
    if (S.bad > 0) { S.bad -= .03; for (var k = 0; k < 30; k++) { cx.fillStyle = 'rgba(255,93,115,' + Math.random() * .3 + ')'; cx.fillRect(bx + Math.random() * bw, by + Math.random() * bh, 20, 2); } }
    if (!rep) return;
    var G = '#5cffd0', L = 'rgba(160,255,230,.85)', pad = 34, x0 = bx + pad, x1 = bx + bw - pad, yb = by + bh - 34, yt = by + 20;
    cx.lineWidth = 1.5; cx.font = F(Math.max(10, bw / 52)); cx.fillStyle = L; cx.strokeStyle = L; cx.textAlign = 'center';
    function axis(lo, hi, step, y) { var X = function (v) { return x0 + (v - lo) / (hi - lo) * (x1 - x0); }; cx.strokeStyle = L; cx.beginPath(); cx.moveTo(x0, y); cx.lineTo(x1, y); cx.stroke(); if (step > 1 && hi - lo <= 40) for (var u = Math.ceil(lo); u <= hi; u++) { cx.beginPath(); cx.moveTo(X(u), y - 3); cx.lineTo(X(u), y + 3); cx.stroke(); } for (var v = lo; v <= hi + 1e-9; v += step) { cx.beginPath(); cx.moveTo(X(v), y - 7); cx.lineTo(X(v), y + 7); cx.stroke(); cx.fillText(M1.n(v), X(v), y + 19); } return X; }
    function nice(lo, hi) { var span = hi - lo, st = span <= 12 ? 1 : span <= 25 ? 2 : span <= 60 ? 5 : 10; return [Math.floor(lo / st) * st, Math.ceil(hi / st) * st, st]; }
    function boxAt(f, X, yc, h, col, mark) {
      cx.strokeStyle = col; cx.lineWidth = 2.5; cx.shadowColor = col; cx.shadowBlur = 8;
      cx.beginPath(); cx.moveTo(X(f[0]), yc); cx.lineTo(X(f[1]), yc); cx.moveTo(X(f[3]), yc); cx.lineTo(X(f[4]), yc);
      cx.moveTo(X(f[0]), yc - h * .3); cx.lineTo(X(f[0]), yc + h * .3); cx.moveTo(X(f[4]), yc - h * .3); cx.lineTo(X(f[4]), yc + h * .3); cx.stroke();
      cx.fillStyle = 'rgba(92,255,208,.12)'; cx.fillRect(X(f[1]), yc - h / 2, X(f[3]) - X(f[1]), h); cx.strokeRect(X(f[1]), yc - h / 2, X(f[3]) - X(f[1]), h);
      cx.beginPath(); cx.moveTo(X(f[2]), yc - h / 2); cx.lineTo(X(f[2]), yc + h / 2); cx.stroke(); cx.shadowBlur = 0;
      if (mark != null) { cx.fillStyle = '#ffc107'; cx.beginPath(); cx.arc(X(mark), yc, 6, 0, 7); cx.fill(); }
    }
    if (rep.t === 'dot') {
      var lo = Math.min.apply(0, rep.vals) - 1, hi = Math.max.apply(0, rep.vals) + 1, X = axis(lo, hi, 1, yb), cnt = {};
      var r = Math.min(12, (x1 - x0) / (hi - lo) / 2.6);
      rep.vals.slice().sort(function (a, b) { return a - b; }).forEach(function (v) { cnt[v] = (cnt[v] || 0) + 1; cx.fillStyle = G; cx.shadowColor = G; cx.shadowBlur = 8; cx.beginPath(); cx.arc(X(v), yb - 8 - (cnt[v] - .5) * r * 2.3, r, 0, 7); cx.fill(); cx.shadowBlur = 0; });
    } else if (rep.t === 'list') {
      cx.font = F(Math.max(16, bw / 18), 700); cx.fillStyle = '#fff'; cx.shadowColor = G; cx.shadowBlur = 12; cx.fillText(rep.vals.map(M1.n).join(',  '), bx + bw / 2, by + bh / 2 + 10); cx.shadowBlur = 0;
    } else if (rep.t === 'box' || rep.t === 'box2') {
      var all = rep.t === 'box' ? rep.five.concat(rep.mark != null ? [rep.mark] : []) : rep.A.concat(rep.B), nn = nice(Math.min.apply(0, all) - 1, Math.max.apply(0, all) + 1), X2 = axis(nn[0], nn[1], nn[2], yb);
      if (rep.t === 'box') boxAt(rep.five, X2, (yt + yb) / 2, (yb - yt) * .35, G, rep.mark);
      else { boxAt(rep.A, X2, yt + (yb - yt) * .3, (yb - yt) * .22, '#5cffd0'); boxAt(rep.B, X2, yt + (yb - yt) * .72, (yb - yt) * .22, '#ff9fcb');
        cx.font = F(Math.max(12, bw / 40), 700); cx.textAlign = 'left'; cx.fillStyle = '#5cffd0'; cx.fillText('Reef A', x0, yt + (yb - yt) * .3 - (yb - yt) * .14); cx.fillStyle = '#ff9fcb'; cx.fillText('Reef B', x0, yt + (yb - yt) * .72 - (yb - yt) * .14); }
    } else if (rep.t === 'hist') {
      var nb = rep.counts.length, mx = Math.max.apply(0, rep.counts), top = Math.max(2, mx + 1), bw2 = (x1 - x0) / nb, Y = function (v) { return yb - v / top * (yb - yt); };
      cx.textAlign = 'right'; for (var v = 0; v <= top; v++) { cx.strokeStyle = 'rgba(160,255,230,.15)'; cx.beginPath(); cx.moveTo(x0, Y(v)); cx.lineTo(x1, Y(v)); cx.stroke(); if (top <= 10 || v % 2 === 0) { cx.fillStyle = L; cx.fillText(v, x0 - 6, Y(v) + 4); } }
      rep.counts.forEach(function (c, k) { cx.fillStyle = 'rgba(92,255,208,.35)'; cx.strokeStyle = G; cx.fillRect(x0 + k * bw2, Y(c), bw2, yb - Y(c)); cx.strokeRect(x0 + k * bw2, Y(c), bw2, yb - Y(c)); });
      cx.textAlign = 'center'; cx.fillStyle = L; for (k = 0; k <= nb; k++) cx.fillText(rep.lo + k * rep.w, x0 + k * bw2, yb + 17);
    } else if (rep.t === 'scatter') {
      var ys = rep.pts.map(function (p) { return p[1]; }), yn = nice(Math.min.apply(0, ys) - 2, Math.max.apply(0, ys) + 2), Xs = axis(0, 11, 1, yb), Ys = function (v) { return yb - (v - yn[0]) / (yn[1] - yn[0]) * (yb - yt); };
      cx.textAlign = 'right'; for (v = yn[0]; v <= yn[1]; v += yn[2] * 2) { cx.strokeStyle = 'rgba(160,255,230,.15)'; cx.beginPath(); cx.moveTo(x0, Ys(v)); cx.lineTo(x1, Ys(v)); cx.stroke(); cx.fillStyle = L; cx.fillText(M1.n(v), x0 - 6, Ys(v) + 4); }
      if (rep.line) { cx.strokeStyle = '#ffc107'; cx.lineWidth = 2.5; cx.beginPath(); cx.moveTo(Xs(0), Ys(rep.line.b)); cx.lineTo(Xs(11), Ys(rep.line.m * 11 + rep.line.b)); cx.stroke(); }
      rep.pts.forEach(function (p) { var mk = rep.mark && rep.mark[0] === p[0]; cx.fillStyle = mk ? '#ff9fcb' : G; cx.beginPath(); cx.arc(Xs(p[0]), Ys(p[1]), mk ? 7 : 5, 0, 7); cx.fill(); });
    } else {
      cx.font = F(Math.max(16, Math.min(bh * .12, bw / (rep.text.length * .62))), 700); cx.fillStyle = '#fff'; cx.shadowColor = G; cx.shadowBlur = 12; cx.fillText(rep.text, bx + bw / 2, by + bh / 2 + 8); cx.shadowBlur = 0;
    }
  }
  function rr(x, y, w, h, r) { cx.beginPath(); cx.moveTo(x + r, y); cx.arcTo(x + w, y, x + w, y + h, r); cx.arcTo(x + w, y + h, x, y + h, r); cx.arcTo(x, y + h, x, y, r); cx.arcTo(x, y, x + w, y, r); cx.closePath(); }
  function frame(t) {
    if (!W) size();
    S.show += (S.depth - S.show) * .03;
    var d = Math.min(1, S.show / 800), g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgb(' + Math.round(10 - 8 * d) + ',' + Math.round(80 - 70 * d) + ',' + Math.round(120 - 100 * d) + ')'); g.addColorStop(1, 'rgb(2,' + Math.round(20 - 15 * d) + ',' + Math.round(40 - 30 * d) + ')');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    if (d < .5) { cx.fillStyle = 'rgba(180,240,255,' + (.08 * (1 - d * 2)) + ')'; for (var k = 0; k < 5; k++) { cx.beginPath(); cx.moveTo(W * (.1 + k * .2), 0); cx.lineTo(W * (.05 + k * .2), H); cx.lineTo(W * (.15 + k * .2), H); cx.fill(); } }
    S.bub.forEach(function (b) { b.y -= b.v / H * 3; if (b.y < 0) { b.y = 1; b.x = Math.random(); } cx.strokeStyle = 'rgba(200,240,255,.35)'; cx.beginPath(); cx.arc(b.x * W, b.y * H, b.r, 0, 7); cx.stroke(); });
    S.crit.forEach(function (c) { creature(c, t); });
    // sea floor at the bottom of the dive
    cx.fillStyle = 'rgba(30,24,16,' + d + ')'; cx.beginPath(); cx.moveTo(0, H); for (var x = 0; x <= W; x += 20) cx.lineTo(x, H * .95 - Math.sin(x / 50) * 6); cx.lineTo(W, H); cx.fill();
    sub(t);
    // depth gauge
    cx.fillStyle = 'rgba(0,0,0,.45)'; rr(W * .02, H * .76, W * .25, H * .18, 10); cx.fill();
    cx.fillStyle = '#ffd54a'; cx.font = F(Math.max(11, W / 60), 700); cx.textAlign = 'left'; cx.fillText('DEPTH', W * .035, H * .81);
    cx.font = F(Math.max(16, W / 28), 700); cx.fillStyle = '#fff'; cx.fillText(Math.round(S.show) + ' m', W * .035, H * .9);
    sonar(S.q && S.q.rep, t);
    requestAnimationFrame(frame);
  }
  size(); requestAnimationFrame(frame);
  var COLS = ['#ff9f43', '#ff6b9d', '#7fe6ff', '#c084fc', '#7dff9b', '#ffd54a'];

  M1.game({
    key: 'dd-best', title: 'Data Dive', go: 'Start the dive →',
    intro: 'Your research submarine is diving to the bottom of the ocean. The sonar screen shows data about what is down there: dot plots, box plots, histograms and scatter plots. Read the data right and the sub dives deeper, finding new creatures on the way.',
    how: [['1. Read the sonar', 'The screen shows the data. The question is on the right.'], ['2. Pick an answer', 'A wrong answer scrambles the sonar and tells you the mistake.'], ['3. Dive deep', 'Every right answer takes you 100 m deeper. Reach the sea floor!']],
    levels: [
      { id: 'd1', name: 'Dive 1: Center', what: 'Median from a dot plot, mean, shape of a histogram', kinds: ['medDot', 'meanList', 'shape', 'medDot', 'hist', 'meanList', 'shape', 'medDot'] },
      { id: 'd2', name: 'Dive 2: Spread', what: 'Box plots: median, quartiles, range, IQR, compare two', kinds: ['boxRead', 'iqr', 'boxRead', 'cmpBox', 'iqr', 'boxRead', 'cmpBox', 'iqr'] },
      { id: 'd3', name: 'Dive 3: Outliers', what: '1.5 · IQR fences; is it an outlier?', kinds: ['fence', 'isOut', 'iqr', 'fence', 'isOut', 'fence', 'isOut', 'hist'] },
      { id: 'd4', name: 'Dive 4: Scatter & Regression', what: 'Predict with a line, residuals, what the slope means', kinds: ['predict', 'slopeMean', 'resid', 'predict', 'resid', 'slopeMean', 'predict', 'resid'] },
      { id: 'd5', name: 'Dive 5: Correlation', what: 'Pick r from a scatter plot; correlation vs. causation', kinds: ['corr', 'cause', 'corr', 'corr', 'cause', 'corr', 'cause', 'corr'] },
      { id: 'd6', name: 'Trench: Mixed', what: 'A bit of everything', kinds: ['medDot', 'iqr', 'fence', 'predict', 'corr', 'resid', 'cmpBox', 'cause'] }
    ],
    make: DDQ.make, word: { item: 'Reading', done: 'You reached the sea floor!', wait: 'Diving…' }, notes: ['unit5-notes.html', 'the Unit 5 notes'],
    scene: {
      level: function () { S.depth = 0; S.show = 0; S.crit = []; },
      question: function (q) { S.q = q; },
      miss: function () { S.bad = 1; M1.sfx.bad(); },
      right: function (q, r, G, done) {
        S.ping = 1; M1.sfx.chime(); S.depth += 100;
        var k = KINDS[Math.min(KINDS.length - 1, G.i)];
        var odd = S.crit.length % 2; S.crit.push({ k: k, x: odd ? .36 + Math.random() * .55 : .06 + Math.random() * .18, y: odd ? .8 + Math.random() * .08 : .36 + Math.random() * .3, s: k === 'angler' ? 1.3 : 1, dir: Math.random() < .5 ? 1 : -1, ph: Math.random() * 6, col: COLS[S.crit.length % COLS.length] });
        if (S.crit.length > 6) S.crit.shift();
        setTimeout(done, M1.RM ? 100 : 1300);
      }
    }
  });
})();
