<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 4: Comparing Loan Offers — Math in Financial Literacy</title>
<meta name="description" content="Use a system of equations to find when two loan offers cost the same and decide which is the better deal.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../site.css">
<link rel="stylesheet" href="fl.css">
<script src="../../brand.js"></script>
</head>
<body>
<script src="../../site-bar.js"></script>
<div class="page-wrap"><main id="fl"></main></div>
<div class="site-footer">© Mr. Allen's Math Class · Math in Financial Literacy</div>
<script src="fl.js"></script>
<script>
(function () {
  var C = FL.COLORS, $ = FL.money;
  // totals in whole dollars (exact integers)
  function A(m) { return 2000 + 250 * m; }
  function B(m) { return 500 + 300 * m; }
  // solve d1 + r1 m = d2 + r2 m exactly; returns {m: {n,d}}
  function meet(d1, r1, d2, r2) { return { n: d1 - d2, d: r2 - r1 }; }

  function loanGraph(box, withSlider) {
    var g = new FL.Graph({ xmin: 0, xmax: 48, ymin: 0, ymax: 16000, xstep: 6, ystep: 2000, xlabel: 'Months (m)', ylabel: 'Total paid',
      yfmt: function (v) { return '$' + FL.num(v / 1000) + 'k'; }, title: 'Offer A and Offer B' });
    g.fn(A, { color: C.navy }); g.fn(B, { color: C.red, dash: '9 5' });
    g.label(44, A(44), 'A', { dy: 22, color: C.navy }); g.label(40, B(40), 'B', { dx: -14, dy: -6, color: C.red });
    g.dot(30, 9500, { color: C.gold, r: 7 }); g.label(30, 9500, '(30, 9,500)', { dx: -10, dy: -14, anchor: 'end', color: '#8A6100' });
    var dyn = g.layer(true); box.appendChild(g.svg);
    box.insertAdjacentHTML('beforeend', '<div class="fl-legend"><span><i style="border-color:#1E2D4F"></i>Offer A = 2000 + 250m</span><span><i class="dash" style="border-color:#B42318"></i>Offer B = 500 + 300m</span></div>');
    if (!withSlider) return;
    var out = FL.el('div', 'fl-readout');
    FL.slider(box, { label: 'Months', min: 0, max: 48, step: 1, value: 12, onInput: function (m) {
      dyn.innerHTML = ''; g.vline(m, {}, dyn); g.dot(m, A(m), { color: C.navy }, dyn); g.dot(m, B(m), { color: C.red }, dyn);
      var a = A(m), b = B(m);
      out.innerHTML = 'm = ' + m + ': A = ' + $(a * 100, 'auto') + ' · B = ' + $(b * 100, 'auto') + ' → ' + (a === b ? '<b>same cost</b>' : (a < b ? '<b>A</b>' : '<b>B</b>') + ' costs less');
    } });
    box.appendChild(out);
  }

  FL.lesson({
    id: 'finlit-4', num: 4, title: 'Comparing Loan Offers',
    question: 'A used car has two loan offers. One has a big down payment and low monthly payments. The other is the opposite. Which one costs less? It depends on how many months!',
    stds: 'NC.8.EE.8 · NC.8.F.4', fl: 'FL.8.3 (FL8 3.2)',
    target: 'I can use a system of equations to find when two loan offers cost the same and decide which is the better deal.',
    vocab: ['down payment', 'monthly payment', 'total cost', 'secured loan', 'unsecured loan', 'collateral', 'system of equations', 'point of intersection'],
    steps: [
      {
        title: 'Write each offer as a function',
        html: '<p><b>Offer A:</b> $2,000 down, then $250 a month. <b>Offer B:</b> $500 down, then $300 a month.</p>' +
          '<p><span class="fl-eq">A = 2000 + 250m</span> <span class="fl-eq">B = 500 + 300m</span></p>' +
          '<p>The <b>y-intercept</b> is the down payment (paid at the start). The <b>slope</b> is the monthly payment.</p>' +
          '<p class="fl-how">To keep the model linear, these totals leave out interest.</p>',
        tries: [{ type: 'num', q: 'What is the total paid for <b>Offer A</b> after <b>10 months</b>?', pre: '$', ans: '4500',
          hint: 'A = 2000 + 250(10). Multiply first.', explain: '250 × 10 = 2,500, and 2,000 + 2,500 = $4,500.',
          wrong: [{ v: '2500', msg: 'You found the monthly part. Add the $2,000 down payment.' }, { v: '3500', msg: '$3,500 is Offer B after 10 months. Use Offer A: 2000 + 250m.' }, { v: '22500', msg: 'Multiply 250 × 10 first, then add 2,000.' }] }]
      },
      {
        title: 'Graph the system',
        html: '<p>Two equations together are a <b>system</b>. Graph both lines. Where they cross is the <b>point of intersection</b>: the month when both offers cost the same. Move the slider.</p>',
        fig: function (box) { loanGraph(box, true); },
        tries: [{ type: 'num', q: 'Use the graph. After how many months do the offers cost the <b>same</b>?', post: 'months', ans: '30',
          hint: 'Find the gold point where the lines cross. Read the x-value.', explain: 'The lines cross at m = 30.',
          wrong: [{ v: '9500', msg: '9,500 is the y-value (the cost). The question asks for months, the x-value.' }] }]
      },
      {
        title: 'Solve with algebra',
        html: '<p>Set the two totals equal and solve:</p>' +
          '<p><span class="fl-eq">2000 + 250m = 500 + 300m</span><br><span class="fl-eq">2000 = 500 + 50m</span> (subtract 250m)<br><span class="fl-eq">1500 = 50m</span> (subtract 500)<br><span class="fl-eq">m = 30</span> (divide by 50)</p>' +
          '<p>Check: put m = 30 into <b>both</b> equations. They should give the same total.</p>',
        tries: [{ type: 'num', q: 'What is the total cost of each offer at <b>m = 30</b>?', pre: '$', ans: '9500',
          hint: 'A = 2000 + 250(30). Then check B = 500 + 300(30).', explain: 'A = 2,000 + 7,500 = 9,500 and B = 500 + 9,000 = 9,500. Both are $9,500.',
          wrong: [{ v: '7500', msg: 'You found 250 × 30. Add the $2,000 down payment.' }, { v: '9000', msg: 'You found 300 × 30. Add the $500 down payment.' }] }]
      },
      {
        title: 'Pick the better deal',
        html: '<p>The intersection splits the graph into two parts:</p><ul><li><b>Before</b> month 30, Offer B’s line is lower, so B costs less.</li><li><b>After</b> month 30, Offer A’s line is lower, so A costs less.</li></ul>' +
          '<p>Example: a 48-month loan. A = 2,000 + 250(48) = $14,000. B = 500 + 300(48) = $14,900. Offer A costs less.</p>',
        tries: [{ type: 'mc', q: 'Which offer costs less for a <b>24-month</b> loan?', choices: ['Offer B ($7,700)', 'Offer A ($8,000)', 'They cost the same', 'You cannot tell'], ans: 0,
          hint: '24 is less than 30. Which line is lower before the intersection?',
          why: { 1: 'Find both totals: A = 8,000 and B = 7,700. B is less.', 2: 'They are only the same at 30 months.', 3: 'Put 24 into both equations and compare.' },
          explain: 'A = 2,000 + 6,000 = $8,000. B = 500 + 7,200 = $7,700. B costs less.' }]
      }
    ],
    assign: [
      { type: 'num', kind: 'system word problem', q: '<b>Offer C:</b> $1,000 down + $200 a month. <b>Offer D:</b> $0 down + $250 a month. After how many months do they cost the <b>same</b>?', post: 'months', ans: '20',
        hint: 'Solve 1000 + 200m = 250m. Subtract 200m from both sides.', explain: '1,000 = 50m, so m = 20 months.',
        wrong: [{ v: '5000', msg: '$5,000 is the cost at the break-even point. The question asks for months.' }, { v: '5', msg: 'Check: 1000 = 50m. Divide 1,000 by 50.' }, { v: '2.22', msg: 'Subtract 200m from both sides first: 1000 = 50m.' }] },
      { type: 'mc', kind: 'multiple choice', q: 'Use Offers C and D from Question 1. Which offer costs less for a <b>12-month</b> loan?', choices: ['Offer D', 'Offer C', 'They cost the same', 'You cannot tell'], ans: 0,
        hint: 'Find each total for m = 12. C = 1000 + 200(12). D = 250(12).',
        why: { 1: 'C = 1,000 + 2,400 = $3,400. D = $3,000. D is less.', 2: 'They are the same only at 20 months.', 3: 'Put 12 into both equations and compare.' },
        explain: 'C = $3,400 and D = $3,000. For 12 months, D costs less.' },
      { type: 'num', kind: 'numeric entry', q: 'Use Offers C and D. What is the total cost of <b>each</b> offer at the point where they are equal?', pre: '$', ans: '5000',
        hint: 'You found m = 20. Put it into D = 250m.', explain: 'D = 250 × 20 = $5,000, and C = 1,000 + 4,000 = $5,000.',
        wrong: [{ v: '20', msg: '20 is the number of months. Put m = 20 into an equation to find the cost.' }, { v: '4000', msg: '$4,000 is 200 × 20. Add the $1,000 down payment.' }] },
      { type: 'mc', kind: 'interpret', q: 'In <b>A = 2000 + 250m</b>, what does <b>250</b> mean?', choices: ['The monthly payment', 'The down payment', 'The total cost', 'The number of months'], ans: 0,
        hint: '250 is the slope. It is multiplied by m (months).', why: { 1: 'The down payment is the y-intercept, 2,000.', 2: 'The total cost is A, which changes with m.', 3: 'The number of months is m.' },
        explain: '250 is the rate of change: $250 more each month.' },
      { type: 'mc', kind: 'solution of a system', q: 'A = 2000 + 250m and B = 500 + 300m. Which point is a solution to <b>both</b> equations?', choices: ['(10, 4,500)', '(20, 6,500)', '(30, 9,500)', '(40, 12,500)'], ans: 2,
        hint: 'Put each m into both equations. Both must give the y-value.',
        why: { 0: '(10, 4,500) works for A, but B(10) = 3,500. It is only on one line.', 1: '(20, 6,500) works for B, but A(20) = 7,000.', 3: '(40, 12,500) works for B, but A(40) = 12,000.' },
        explain: 'A(30) = 9,500 and B(30) = 9,500. Only (30, 9,500) is on both lines.' },
      { type: 'sel', kind: 'select all', q: 'Use the graph of Offers A and B (they cross at (30, 9,500)). Select <b>all</b> true statements.',
        fig: function (f) { loanGraph(f, false); },
        choices: ['Before 30 months, Offer B costs less.', 'After 30 months, Offer A costs less.', 'At 30 months, they cost the same.', 'Offer A always costs less.', 'The intersection shows the down payment.'], ans: [0, 1, 2],
        hint: 'Which line is lower on each side of the gold point?',
        why: { 3: 'Before month 30, Offer A’s line is higher, so it costs more.', 4: 'The down payments are the y-intercepts, at m = 0.' },
        explain: 'B is lower before 30, they meet at 30, and A is lower after 30.' },
      { type: 'err', kind: 'find the error', q: 'Kai solved <b>2000 + 250m = 500 + 300m</b>. Find the <b>first</b> mistake.',
        lines: ['2000 = 500 + 50m', '2500 = 50m', 'm = 50'], ans: 1,
        hint: 'To move the 500, do the opposite of adding 500.',
        why: { 0: 'Line 1 is right. Kai subtracted 250m from both sides.', 2: 'Line 3 divides correctly, but line 2 already has a mistake.' },
        explain: 'Kai added 500 instead of subtracting. 2000 − 500 = 1500, so 1500 = 50m and m = 30.' },
      { type: 'num', kind: 'word problem', q: '<b>Offer E:</b> $900 down + $150 a month. <b>Offer F:</b> $0 down + $180 a month. They cost the same after 30 months. What is that total cost?', pre: '$', ans: '5400',
        hint: 'Put m = 30 into F = 180m. Check with E.', explain: 'F = 180 × 30 = $5,400. E = 900 + 4,500 = $5,400.',
        wrong: [{ v: '4500', msg: '$4,500 is 150 × 30. Add the $900 down payment.' }, { v: '30', msg: '30 is the months. Find the cost at m = 30.' }] }
    ],
    desmos: '<ol><li>Type <code>y = 2000 + 250x {x ≥ 0}</code> and <code>y = 500 + 300x {x ≥ 0}</code>.</li>' +
      '<li>Wrench icon: set x from 0 to 50 and y from 0 to 16,000.</li>' +
      '<li>Click the gray point where the lines cross. It should say (30, 9500).</li>' +
      '<li>Which offer costs less for a 24-month loan? For a 48-month loan? Use the graph to explain.</li></ol>',
    ixl: [
      ['Solve a system of equations by graphing: word problems (NC.8.EE.8)', 'https://www.ixl.com/math/grade-8/solve-a-system-of-equations-by-graphing-word-problems'],
      ['Is (x, y) a solution to the system of equations? (NC.8.EE.8)', 'https://www.ixl.com/math/grade-8/is-x-y-a-solution-to-the-system-of-equations'],
      ['Solve equations with variables on both sides: word problems (NC.8.EE.7)', 'https://www.ixl.com/math/grade-8/solve-equations-with-variables-on-both-sides-word-problems'],
      ['Write linear functions: word problems (NC.8.F.4)', 'https://www.ixl.com/math/grade-8/write-linear-functions-word-problems']
    ],
    test: function () {
      var x = meet(2000, 250, 500, 300); FL.assertEq(x.n / x.d, 30, 'L4 A=B at 30');
      FL.assertEq(A(30), 9500, 'L4 A(30)'); FL.assertEq(B(30), 9500, 'L4 B(30)');
      FL.assertEq(A(10), 4500, 'L4 A(10)');
      FL.assertEq(A(24), 8000, 'L4 A(24)'); FL.assertEq(B(24), 7700, 'L4 B(24)');
      FL.assertEq(A(48), 14000, 'L4 A(48)'); FL.assertEq(B(48), 14900, 'L4 B(48)');
      var y = meet(1000, 200, 0, 250); FL.assertEq(y.n / y.d, 20, 'L4 C=D at 20');
      FL.assertEq(1000 + 200 * 12, 3400, 'L4 C(12)'); FL.assertEq(250 * 12, 3000, 'L4 D(12)'); FL.assertEq(250 * 20, 5000, 'L4 D(20)');
      FL.assertEq(B(10), 3500, 'L4 B(10)'); FL.assertEq(B(20), 6500, 'L4 B(20)'); FL.assertEq(A(20), 7000, 'L4 A(20)'); FL.assertEq(B(40), 12500, 'L4 B(40)'); FL.assertEq(A(40), 12000, 'L4 A(40)');
      var z = meet(900, 150, 0, 180); FL.assertEq(z.n / z.d, 30, 'L4 E=F at 30'); FL.assertEq(180 * 30, 5400, 'L4 F(30)'); FL.assertEq(900 + 150 * 30, 5400, 'L4 E(30)');
    }
  });
})();
</script>
</body>
</html>
