<script>window.PRACTICE = {"unit": "2", "pdf": "Unit2_Exponent_Rules_Practice2_Blank.pdf", "key": "Unit2_Exponent_Rules_Practice2_AnswerKey.pdf", "data": {"title": "Unit 2 Homework — Exponent Rules", "sub": "Complete independently · Exponent Rules", "secs": [{"title": "A. Exponent Rules — Product & Quotient", "std": "NC.8.EE.1", "hint": "Same base: multiply → add exponents, divide → subtract exponents. Multiply or divide the coefficients normally.", "probs": [{"n": 1, "q": "Simplify: x⁵ · x⁶", "ans": "x¹¹", "lv": 3}, {"n": 2, "q": "Simplify: b⁹ ÷ b⁴", "ans": "b⁵", "lv": 3}, {"n": 3, "q": "Simplify: (4x²)(2x⁵)", "ans": "8x⁷", "lv": 4}, {"n": 4, "q": "Simplify: 24m⁸ ÷ 6m³", "ans": "4m⁵", "lv": 4}, {"n": 5, "q": "Simplify: c³ · c⁴ · c²", "ans": "c⁹", "lv": 4}, {"n": 6, "q": "Simplify: (7y⁴)(2y)", "ans": "14y⁵", "lv": 4}]}, {"title": "B. Power, Zero & Negative Exponents", "std": "NC.8.EE.1", "hint": "Power of a power → multiply exponents. Anything (except 0) to the 0 power is 1. A negative exponent means 1 over the positive power.", "probs": [{"n": 1, "q": "Simplify: (y⁵)²", "ans": "y¹⁰", "lv": 3}, {"n": 2, "q": "Simplify: 12⁰", "ans": "1", "lv": 3}, {"n": 3, "q": "Simplify: (3x²)²", "ans": "9x⁴", "lv": 4}, {"n": 4, "q": "Simplify: (8m³n²)⁰", "ans": "1", "lv": 4}, {"n": 5, "q": "Simplify: 2⁻³ (write as a fraction)", "ans": "<span class=\"fr\"><span>1</span><span>8</span></span>", "lv": 4}, {"n": 6, "q": "Simplify: y⁻² (write as a fraction)", "ans": "<span class=\"fr\"><span>1</span><span>y²</span></span>", "lv": 4}, {"n": 7, "q": "Evaluate −2⁴ (no parentheses).", "ans": "−16", "lv": 5}, {"n": 11, "q": "Lena says 2⁻³ = −8. Which fixes her mistake?", "ans": "A negative exponent means a reciprocal: 2⁻³ = 1/2³ = 1/8", "lv": 5, "choices": ["Flip the base: (1/2)³ = 1/6", "A negative exponent means a reciprocal: 2⁻³ = 1/2³ = 1/8", "Lena is right. A negative exponent makes the answer negative.", "Multiply instead: 2 × (−3) = −6"], "why": {"Lena is right. A negative exponent makes the answer negative.": "A negative exponent does NOT make the answer negative. It moves the power to the bottom of a fraction.", "Multiply instead: 2 × (−3) = −6": "An exponent means repeated multiplication. It never means base × exponent.", "Flip the base: (1/2)³ = 1/6": "Flipping is right, but (1/2)³ = 1/2 × 1/2 × 1/2 = 1/8, not 1/6."}}, {"n": 12, "q": "Simplify: (3x²y³)² · (2x⁻¹y⁴)", "ans": "18x³y¹⁰", "lv": 5, "choices": ["18x⁵y¹⁰", "18x³y⁹", "18x³y¹⁰", "6x³y¹⁰"], "why": {"6x³y¹⁰": "Square the 3 as well: 3² = 9. Then 9 × 2 = 18.", "18x⁵y¹⁰": "The exponent is −1, so add a negative: 4 + (−1) = 3.", "18x³y⁹": "Power of a power: MULTIPLY 3 × 2 = 6 first. Then 6 + 4 = 10."}}, {"n": 13, "q": "Simplify: (6a⁴b)(2a⁻¹b³) ÷ (4a³b⁶)", "ans": "3/b²", "lv": 5, "choices": ["8/b²", "3a⁶/b²", "3/b²", "3b²"], "why": {"3b²": "The b exponent is 4 − 6 = −2. A negative exponent moves b² to the bottom.", "8/b²": "Divide the front numbers: 12 ÷ 4 = 3. Do not subtract them.", "3a⁶/b²": "When you divide, SUBTRACT the exponents: a³ ÷ a³ = a⁰ = 1."}}]}]}};</script>
