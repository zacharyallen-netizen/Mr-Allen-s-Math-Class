<script>window.PRACTICE = {"unit": "WB", "data": {"title": "Winter Break Review — Version 2", "sub": "Units 1–4, one skill at a time. Each section has a review box and a link to a short Skill Builders video.", "intro": "<p class=\"wb-top\">You are building the <b>foundation for Math 1</b>. Every skill here comes back next year, so make it strong now. Do one section a day. Read the yellow Quick review first, then do the problems. When you finish, tap <b>Send my work</b>. Warm up with the <a href=\"Fluency-Lab-Package/fluency-lab/index.html\">Fluency Lab</a> and reward yourself in the <a href=\"arcade.html\">Math Arcade</a>!</p>", "secs": [{"title": "A. Rational vs. Irrational & the 9’s Rule", "std": "NC.8.NS.1", "hint": "Rational = can be a fraction (whole numbers, decimals that end or repeat, √ of a perfect square). Irrational = never ends AND never repeats (π, √2, √20). Repeating decimal → the repeating digits over 9s.", "intro": "<details class=\"wb-box\" open><summary>Quick review</summary><p><b>The rule:</b> A number is <b>rational</b> if it can be written as a fraction. Decimals that stop or repeat are rational. √ of a perfect square (√49 = 7) is rational. A number is <b>irrational</b> if the decimal never ends and never repeats: π, √2, √20.</p><p><b>Example:</b> The 9’s rule: 0.363636… → the repeating part is 36 (two digits), so write <span class=\"fr\"><span>36</span><span>99</span></span> = <span class=\"fr\"><span>4</span><span>11</span></span>.</p><p class=\"wb-eog\"><b>On the EOG:</b> “Select all the irrational numbers” and “Which fraction equals 0.27 repeating?” Only 1 in 5 students got these right on our Check-In.</p><p class=\"wb-m1\"><b>In Math 1:</b> You will solve x² = 7 and get x = ±√7, an irrational answer. You must know the difference.</p><p class=\"wb-sb\">Need to see it again? <a href=\"skill-builders-unit1.html\" target=\"_blank\" rel=\"noopener\">Skill Builders, Unit 1 ↗</a></p></details>", "probs": [{"n": 1, "q": "Is √49 rational or irrational?", "ans": "rational", "lv": 3}, {"n": 2, "q": "Is √20 rational or irrational?", "ans": "irrational", "lv": 3}, {"n": 3, "q": "Use the 9’s rule. Write 0.363636… (36 repeats) as a fraction in simplest form.", "ans": "<span class=\"fr\"><span>4</span><span>11</span></span>", "lv": 4}, {"n": 4, "q": "Use the 9’s rule. Write 0.777… (7 repeats) as a fraction.", "ans": "<span class=\"fr\"><span>7</span><span>9</span></span>", "lv": 4}, {"n": 5, "q": "Is 0.5 rational or irrational?", "ans": "rational", "lv": 3}]}, {"title": "B. Exponent Rules (zero and negative exponents)", "std": "NC.8.EE.1", "hint": "Same base: multiply → add the exponents, divide → subtract. Power of a power → multiply. Anything (not 0) to the 0 power is 1. A negative exponent means flip: 2⁻⁴ = 1/2⁴.", "intro": "<details class=\"wb-box\" open><summary>Quick review</summary><p><b>The rule:</b> Same base: <b>multiply → add</b> exponents, <b>divide → subtract</b>. Power of a power → <b>multiply</b>. <b>a⁰ = 1</b>. A <b>negative exponent flips</b> the number: 2⁻⁴ = <span class=\"fr\"><span>1</span><span>2⁴</span></span> = <span class=\"fr\"><span>1</span><span>16</span></span>. It does NOT make the answer negative.</p><p><b>Example:</b> 3⁵ · 3⁻³ = 3⁵⁺⁽⁻³⁾ = 3² = 9.</p><p class=\"wb-eog\"><b>On the EOG:</b> “Select all the expressions equal to 1/16” and “Find the value of (power, product and zero exponent).” Nobody got these right on our Check-In, so this section matters most.</p><p class=\"wb-m1\"><b>In Math 1:</b> Exponential functions like y = 2ˣ use these rules every day.</p><p class=\"wb-sb\">Need to see it again? <a href=\"skill-builders-unit2.html\" target=\"_blank\" rel=\"noopener\">Skill Builders, Unit 2 ↗</a></p></details>", "probs": [{"n": 1, "q": "Find the value: 2³ · 2²", "ans": "32", "lv": 3}, {"n": 2, "q": "Find the value: 7⁰", "ans": "1", "lv": 3}, {"n": 3, "q": "Find the value: 2⁻⁴ (type a fraction like 1/9)", "ans": "<span class=\"fr\"><span>1</span><span>16</span></span>", "lv": 3}, {"n": 4, "q": "Find the value: 5⁸ ÷ 5⁶", "ans": "25", "lv": 4}]}, {"title": "C. Scientific Notation", "std": "NC.8.EE.4", "hint": "a × 10ⁿ with 1 ≤ a < 10. Multiply: multiply the front numbers, ADD the exponents. Divide: divide the front numbers, SUBTRACT the exponents. Then fix the front number so it is from 1 to 10.", "intro": "<details class=\"wb-box\" open><summary>Quick review</summary><p><b>The rule:</b> Scientific notation is <b>a × 10ⁿ</b> with 1 ≤ a &lt; 10. <b>Multiply:</b> multiply the front numbers, add the exponents. <b>Divide:</b> divide the front numbers, subtract the exponents. <b>Fix it</b> if the front number is 10 or more.</p><p><b>Example:</b> (5 × 10³)(4 × 10²) = 20 × 10⁵ → 2 × 10⁶ (move the decimal one place, add 1 to the exponent).</p><p class=\"wb-eog\"><b>On the EOG:</b> “How many times greater is …?” means divide. Calculators show 2.4E7 for 2.4 × 10⁷. This is our weakest I Can standard: 2 out of 3 students are below a 4.</p><p class=\"wb-m1\"><b>In Math 1:</b> Exponential growth and decay (money, populations) use scientific notation.</p><p class=\"wb-sb\">Need to see it again? <a href=\"skill-builders-unit2.html\" target=\"_blank\" rel=\"noopener\">Skill Builders, Unit 2 ↗</a></p></details>", "probs": [{"n": 1, "q": "Write 45,000 in scientific notation.", "ans": "4.5 × 10⁴", "lv": 3}, {"n": 2, "q": "Write 3.2 × 10⁻³ as a standard number.", "ans": "0.0032", "lv": 3}, {"n": 3, "q": "Multiply: (3 × 10⁴)(2 × 10⁵)", "ans": "6 × 10⁹", "lv": 4}, {"n": 4, "q": "Divide: (8 × 10⁹) ÷ (2 × 10³)", "ans": "4 × 10⁶", "lv": 4}]}, {"title": "D. Equations: Distribute and Variables on Both Sides", "std": "NC.8.EE.7", "hint": "1) Distribute. 2) Combine like terms on each side. 3) Move the x-terms to one side. 4) Move the numbers to the other side. 5) Divide.", "intro": "<details class=\"wb-box\" open><summary>Quick review</summary><p><b>The rule:</b> Follow the same order every time: <b>distribute → combine like terms → x’s to one side → numbers to the other side → divide</b>. Whatever you do to one side, do to the other side.</p><p><b>Example:</b> 3(x − 2) = x + 8 → 3x − 6 = x + 8 → 2x − 6 = 8 → 2x = 14 → x = 7.</p><p class=\"wb-eog\"><b>On the EOG:</b> Numeric entry: you type the value of x. Only 1 in 5 students solved the “distribute, variables on both sides” question on our Check-In.</p><p class=\"wb-m1\"><b>In Math 1:</b> Almost every Math 1 unit starts with solving an equation like these.</p><p class=\"wb-sb\">Need to see it again? <a href=\"skill-builders-unit3.html\" target=\"_blank\" rel=\"noopener\">Skill Builders, Unit 3 ↗</a></p></details>", "probs": [{"n": 1, "q": "Solve: 3(x + 4) = 27", "ans": "5", "lv": 3}, {"n": 2, "q": "Solve: 5x − 7 = 2x + 11", "ans": "6", "lv": 3}, {"n": 3, "q": "Solve: −2(x − 5) = 16", "ans": "−3", "lv": 4}, {"n": 4, "q": "Solve: 2x − 4 = 8", "ans": "6", "lv": 3}, {"n": 5, "q": "Solve: 7x = 28", "ans": "4", "lv": 3}]}, {"title": "E. How Many Solutions?", "std": "NC.8.EE.7", "hint": "Simplify both sides. x = a number → one solution. The x’s cancel and you get a TRUE statement (7 = 7) → infinitely many. The x’s cancel and you get a FALSE statement (2 = 9) → no solution.", "intro": "<details class=\"wb-box\" open><summary>Quick review</summary><p><b>The rule:</b> Simplify both sides. If you get <b>x = a number</b>, there is <b>one solution</b>. If the x’s cancel and you get something <b>true</b> like 7 = 7, there are <b>infinitely many</b>. If you get something <b>false</b> like 2 = 9, there is <b>no solution</b>.</p><p><b>Example:</b> 4x − 1 = 4x + 5 → subtract 4x → −1 = 5. False, so <b>no solution</b>.</p><p class=\"wb-eog\"><b>On the EOG:</b> Every EOG has a “How many solutions?” question. Nobody got it right on our Check-In.</p><p class=\"wb-m1\"><b>In Math 1:</b> Systems of equations: parallel lines never meet (no solution); the same line meets everywhere (infinitely many).</p><p class=\"wb-sb\">Need to see it again? <a href=\"skill-builders-unit3.html\" target=\"_blank\" rel=\"noopener\">Skill Builders, Unit 3 ↗</a></p></details>", "probs": [{"n": 1, "q": "How many solutions? 4x − 1 = 4x + 5", "ans": "no solution", "lv": 3}, {"n": 2, "q": "How many solutions? 2(x + 3) = 2x + 6", "ans": "infinitely many solutions", "lv": 3}, {"n": 3, "q": "How many solutions? 5x + 2 = 3x + 2", "ans": "one solution", "lv": 4}]}, {"title": "F. Inequalities: When to Flip the Sign", "std": "NC.8.EE.7", "hint": "Solve like an equation. If you multiply or divide BOTH sides by a negative number, flip the sign (< becomes >).", "intro": "<details class=\"wb-box\" open><summary>Quick review</summary><p><b>The rule:</b> Solve an inequality like an equation. <b>Only</b> when you multiply or divide by a <b>negative</b> number, <b>flip</b> the sign. Adding or subtracting a negative never flips it.</p><p><b>Example:</b> −2x + 5 &gt; 11 → −2x &gt; 6 → divide by −2 and flip → x &lt; −3.</p><p class=\"wb-eog\"><b>On the EOG:</b> Pick the inequality or the number line that matches. This was the most-missed skill in our class practice.</p><p class=\"wb-m1\"><b>In Math 1:</b> You will solve and graph inequalities, and later systems of inequalities.</p><p class=\"wb-sb\">Need to see it again? <a href=\"skill-builders-unit3.html\" target=\"_blank\" rel=\"noopener\">Skill Builders, Unit 3 ↗</a></p></details>", "probs": [{"n": 1, "q": "Solve: 2x + 3 > 11", "ans": "x > 4", "lv": 3}, {"n": 2, "q": "Solve: −5x < 30", "ans": "x > −6", "lv": 4}, {"n": 3, "q": "Solve: x + 6 ≤ 10", "ans": "x ≤ 4", "lv": 3}]}, {"title": "G. Angles: Parallel Lines and Triangles", "std": "NC.8.G.5", "hint": "Vertical angles are equal. A linear pair adds to 180°. With parallel lines: corresponding, alternate interior and alternate exterior angles are equal; same-side interior angles add to 180°. A triangle’s angles add to 180°. An exterior angle = the two far inside angles added.", "intro": "<details class=\"wb-box\" open><summary>Quick review</summary><p><b>The rule:</b> <b>Equal:</b> vertical angles, corresponding, alternate interior, alternate exterior. <b>Add to 180°:</b> a linear pair, same-side interior angles, the three angles of a triangle. <b>Exterior angle</b> of a triangle = the two far (remote) inside angles added.</p><p><b>Example:</b> Alternate interior angles (3x + 15)° and 75° are equal: 3x + 15 = 75 → 3x = 60 → x = 20.</p><p class=\"wb-eog\"><b>On the EOG:</b> “Find x” with angle expressions, then find the angle. Pick EQUAL or ADD TO 180 first, then write the equation.</p><p class=\"wb-m1\"><b>In Math 1:</b> Geometry proofs in Math 1 and beyond use these angle facts.</p><p class=\"wb-sb\">Need to see it again? <a href=\"skill-builders-unit4.html\" target=\"_blank\" rel=\"noopener\">Skill Builders, Unit 4 ↗</a></p></details>", "probs": [{"n": 1, "q": "Two angles are vertical angles. One is 64°. What is the other angle, in degrees?", "ans": "64", "lv": 3}, {"n": 2, "q": "Two angles form a linear pair. One is 112°. What is the other angle, in degrees?", "ans": "68", "lv": 3}, {"n": 3, "q": "Two parallel lines are cut by a transversal. Alternate interior angles are (3x + 15)° and 75°. Find x.", "ans": "20", "lv": 4}, {"n": 4, "q": "The angles of a triangle are x°, 2x° and 3x°. Find x.", "ans": "30", "lv": 4}]}]}};</script>
