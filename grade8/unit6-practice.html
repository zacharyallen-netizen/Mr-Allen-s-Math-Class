t). The per-unit cost is m (the slope).", "probs": [{"n": 1, "q": "A taxi charges a $4 flat fee plus $2 per mile. Write the cost equation (y = mx + b) where x = miles.", "ans": "y=2x+4", "lv": 4}, {"n": 2, "q": "A gym charges $30 to join plus $25/month. How much for 6 months total?", "ans": "180", "lv": 4}]}, {"title": "E. Comparing Functions", "std": "NC.8.F.2", "hint": "Rate of change = slope. The y-intercept is the value of y when x = 0.", "probs": [{"n": 1, "q": "Function A: y = 3x + 2. Function B has a table showing slope 5. Which has the greater rate of change?", "ans": "function b", "lv": 4}, {"n": 2, "q": "Function A: y = 4x − 1. Function B passes through (0,3) and (2,7). Which has the greater y-intercept?", "ans": "function b", "lv": 5}]}, {"title": "F. Qualitative Graphs", "std": "NC.8.F.5", "hint": "Flat (horizontal) parts of a graph mean nothing is changing.", "probs": [{"n": 1, "q": "A graph shows temperature rising steadily, then staying flat for an hour, then rising again. During the flat part, is temperature increasing, decreasing, or constant?", "ans": "constant", "lv": 3}, {"n": 2, "q": "A car's distance-time graph shows a steep upward line, then a horizontal line. What is happening during the horizontal part?", "ans": "stopped", "lv": 3, "choices": ["Stopped", "Speeding up", "Slowing down", "Going back home"]}]}, {"title": "G. Systems of Equations", "std": "NC.8.EE.8", "hint": "The solution is the point where the two lines cross. For two equations, set them equal and solve for x.", "probs": [{"n": 1, "q": "Find the solution (x,y) to the system of equations graphed.", "ans": "(2,4)", "fig": "practice/fig/Unit6_Practice_G1.png", "size": [401, 363], "lv": 3}, {"n": 2, "q": "Solve the system: y = x + 2 and y = 3x − 2. Find x.", "ans": "2", "lv": 5}]}]}};</script>
