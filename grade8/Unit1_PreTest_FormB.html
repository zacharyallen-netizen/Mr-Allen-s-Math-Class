  .sitenav .brand{font-weight:700;margin-right:auto;}

  .scorebar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--page);border-bottom:1px solid var(--line);padding:10px 0;margin-top:6px;}

  .btn{font:inherit;font-weight:600;border:1.5px solid var(--navy);background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;cursor:pointer;}

  .btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

  .check-btn{font:inherit;font-weight:600;cursor:pointer;border:1.5px solid var(--navy);color:var(--navy);background:transparent;padding:8px 14px;border-radius:7px;}
  .check-btn:hover{background:var(--navy);color:#fff;}
  .check-btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

  .feedback{margin-top:10px;font-size:.92rem;max-height:0;overflow:hidden;transition:max-height .25s ease;}
  .feedback.show{max-height:400px;}
  .feedback .verdict{font-weight:700;}
  .feedback.pass .verdict{color:var(--good);}
  .feedback.fail .verdict{color:var(--bad);}

  /* ---- Number line (clickable) ---- */
  .nlwrap{margin-top:12px;}
  .nl-svg{width:100%;max-width:600px;height:auto;display:block;touch-action:manipulation;}
  .nl-hit{fill:transparent;cursor:pointer;}
  .nl-hit:focus-visible{outline:none;}
  .nl-hit:focus-visible + .nl-tick{stroke:var(--gold);stroke-width:3;}
  .nl-selecthalo{fill:rgba(192,138,30,.18);}
  .nl-readout{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;color:var(--muted);margin-top:4px;}

  /* ---- Ordering (clickable chips + number line) ---- */

  .chip{font:inherit;font-size:1.05rem;cursor:pointer;border:1.5px solid var(--navy);color:var(--navy);background:#fff;padding:6px 14px;border-radius:20px;font-family:"Iowan Old Style",Palatino,Georgia,serif;}
  .chip:hover{background:var(--panel);}
  .chip:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}
  .chip.placed{opacity:.4;cursor:default;background:var(--panel);}
  .order-readout{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.95rem;color:var(--muted);margin-top:4px;}
  .order-readout b{color:var(--navy);}
  .mini{font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;border:1.5px solid var(--line);color:var(--muted);background:transparent;padding:4px 10px;border-radius:6px;}
  .mini:hover{border-color:var(--navy);color:var(--navy);}

  /* ---- Garden panel ---- */
  .garden{width:230px;height:135px;background:var(--panel);border:2px solid var(--navy);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:700;color:var(--navy);font-size:1.15rem;margin:12px auto;}
  .garden sup{font-size:.7em;}

  footer.sitefoot{margin-top:44px;background:var(--navy);color:#fff;text-align:center;padding:18px;font-size:.9rem;}
  footer.sitefoot a{color:#fff;font-weight:600;}
  @media(max-width:520px){.masthead h1{font-size:1.6rem;}input.answer{min-width:120px;}}
</style>

<script>
/* ================= Answer parsing ================= */
function parseNum(raw){
  if(raw==null) return NaN;
  let s = String(raw).toLowerCase().trim();
  s = s.replace(/≈|=/g,'').replace(/feet|ft/g,'').replace(/\u2026/g,'').replace(/\.\.+/g,'').trim().replace(/\s+/g,' ');
  if(s==='') return NaN;
  let m = s.match(/^(?:√|sqrt|root)\s*\(?\s*(\d+(?:\.\d+)?)\s*\)?$/);
  if(m) return Math.sqrt(parseFloat(m[1]));
  m = s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
  if(m){ const w=parseInt(m[1],10),n=parseInt(m[2],10),d=parseInt(m[3],10); const sign=w<0?-1:1; return w+sign*(n/d); }
  m = s.match(/^(-?\d+)\/(-?\d+)$/);
  if(m) return parseInt(m[1],10)/parseInt(m[2],10);
  m = s.match(/^-?\d*\.?\d+$/);
  if(m) return parseFloat(s);
  return NaN;
}
function parseClass(raw){
  let s=String(raw||'').toLowerCase().replace(/[^a-z]/g,'');
  if(s==='') return null;
  if(s==='ir'||s.startsWith('irr')||s==='irrational') return 'IR';
  if(s==='r'||s.startsWith('rat')||s==='rational') return 'R';
  return null;
}
function valCheck(target,tol){ return v=>{const n=parseNum(v);return isFinite(n)&&Math.abs(n-target)<=tol;}; }
function classCheck(want){ return v=>parseClass(v)===want; }

/* ================= SVG helper ================= */
const SVGNS='http://www.w3.org/2000/svg';
function svgEl(tag,attrs){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }

/* ================= Clickable number line (estimate) ================= */
function buildNumberLine(lo,hi,onChange){
  const W=600,H=90, px0=45, px1=555, axisY=58;
  const step=0.1, n=Math.round((hi-lo)/step);
  const xFor=v=> px0 + (v-lo)/(hi-lo)*(px1-px0);
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'nl-svg',role:'radiogroup','aria-label':`Number line from ${lo} to ${hi}`});

  // arrow defs
  const defs=svgEl('defs',{});
  const mk=svgEl('marker',{id:'arw'+lo+'_'+hi,markerWidth:'8',markerHeight:'8',refX:'6',refY:'3',orient:'auto'});
  mk.appendChild(svgEl('path',{d:'M0,0 L6,3 L0,6 Z',fill:'#16233f'}));
  defs.appendChild(mk); svg.appendChild(defs);

  // axis
  svg.appendChild(svgEl('line',{x1:px0-14,y1:axisY,x2:px1+14,y2:axisY,stroke:'#16233f','stroke-width':'2','marker-start':`url(#arw${lo}_${hi})`,'marker-end':`url(#arw${lo}_${hi})`}));

  // ticks + labels
  for(let i=0;i<=n;i++){
    const v=Math.round((lo+i*step)*10)/10;
    const x=xFor(v);
    const isMajor = Math.abs(v-Math.round(v))<1e-9 || Math.abs((v*2)-Math.round(v*2))<1e-9;
    svg.appendChild(svgEl('line',{class:'nl-tick',x1:x,y1:axisY-(isMajor?11:6),x2:x,y2:axisY+(isMajor?11:6),stroke:'#16233f','stroke-width':isMajor?2:1}));
    if(isMajor){
      const t=svgEl('text',{x:x,y:axisY+28,'text-anchor':'middle','font-size':'13',fill:'#1f2a44','font-family':'ui-monospace,Menlo,monospace'});
      t.textContent=(Math.abs(v-Math.round(v))<1e-9)?String(Math.round(v)):v.toFixed(1);
      svg.appendChild(t);
    }
  }

  // marker group (drawn on select)
  const markerG=svgEl('g',{}); svg.appendChild(markerG);
  const halo=svgEl('circle',{class:'nl-selecthalo',r:'11',cx:'-99',cy:axisY}); markerG.appendChild(halo);
  const dot=svgEl('circle',{class:'nl-marker',r:'6',cx:'-99',cy:axisY,fill:'#c08a1e',stroke:'#16233f','stroke-width':'1.5'}); markerG.appendChild(dot);

  // clickable hit targets
  let selected=null; const hits=[];
  function select(v,focusIdx){
    selected=Math.round(v*10)/10;
    const x=xFor(selected);
    halo.setAttribute('cx',x); dot.setAttribute('cx',x);
    dot.setAttribute('fill','#c08a1e');
    hits.forEach(h=>h.el.setAttribute('aria-checked', h.v===selected?'true':'false'));
    onChange&&onChange();
  }
  for(let i=0;i<=n;i++){
    const v=Math.round((lo+i*step)*10)/10;
    const x=xFor(v);
    const hit=svgEl('circle',{class:'nl-hit',cx:x,cy:axisY,r:'13',role:'radio','aria-checked':'false',tabindex:'0','aria-label':v.toFixed(1)});
    hit.addEventListener('click',()=>select(v));
    hit.addEventListener('keydown',e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();select(v);}
      else if(e.key==='ArrowRight'&&i<n){e.preventDefault();hits[i+1].el.focus();}
      else if(e.key==='ArrowLeft'&&i>0){e.preventDefault();hits[i-1].el.focus();}
    });
    hits.push({el:hit,v});
    svg.appendChild(hit);
  }

  const wrap=document.createElement('div'); wrap.className='nlwrap';
  wrap.appendChild(svg);
  const readout=document.createElement('div'); readout.className='nl-readout';
  readout.innerHTML='Tap a mark on the line to plot your estimate.';
  wrap.appendChild(readout);

  return {
    node:wrap,
    hasAnswer:()=>selected!=null,
    getValue:()=>selected,
    mark:(ok)=>{ dot.setAttribute('fill', ok?'#256d4f':'#b23b2e'); readout.innerHTML='You plotted: <b>'+(selected!=null?selected.toFixed(1):'—')+'</b>'; },
    reset:()=>{ selected=null; dot.setAttribute('cx','-99'); halo.setAttribute('cx','-99'); hits.forEach(h=>h.el.setAttribute('aria-checked','false')); readout.innerHTML='Tap a mark on the line to plot your estimate.'; }
  };
}

/* ================= Clickable ordering (chips + number line) ================= */
function buildOrderLine(items,lo,hi,onChange){
  const W=600,H=96, px0=40, px1=560, axisY=64;
  const xFor=v=> px0 + (v-lo)/(hi-lo)*(px1-px0);
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'nl-svg','aria-label':`Number line from ${lo} to ${hi}`});
  const defs=svgEl('defs',{});
  const mk=svgEl('marker',{id:'arwO',markerWidth:'8',markerHeight:'8',refX:'6',refY:'3',orient:'auto'});
  mk.appendChild(svgEl('path',{d:'M0,0 L6,3 L0,6 Z',fill:'#16233f'})); defs.appendChild(mk); svg.appendChild(defs);
  svg.appendChild(svgEl('line',{x1:px0-12,y1:axisY,x2:px1+12,y2:axisY,stroke:'#16233f','stroke-width':'2','marker-start':'url(#arwO)','marker-end':'url(#arwO)'}));
  for(let v=lo; v<=hi+1e-9; v+=0.5){
    const x=xFor(v), major=Math.abs(v-Math.round(v))<1e-9;
    svg.appendChild(svgEl('line',{x1:x,y1:axisY-(major?10:5),x2:x,y2:axisY+(major?10:5),stroke:'#16233f','stroke-width':major?2:1}));
    if(major){const t=svgEl('text',{x:x,y:axisY+27,'text-anchor':'middle','font-size':'13',fill:'#1f2a44','font-family':'ui-monospace,Menlo,monospace'});t.textContent=String(Math.round(v));svg.appendChild(t);}
  }
  const markerG=svgEl('g',{}); svg.appendChild(markerG);

  const wrap=document.createElement('div'); wrap.className='nlwrap';
  wrap.appendChild(svg);
  const chipsRow=document.createElement('div'); chipsRow.className='chips';
  const readout=document.createElement('div'); readout.className='order-readout';
  const clear=document.createElement('button'); clear.type='button'; clear.className='mini'; clear.textContent='Clear placements';

  let placed=[]; // {value,label,chipBtn}
  const chipBtns=[];
  items.forEach((it,idx)=>{
    const b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=it.label;
    b.addEventListener('click',()=>{ if(b.classList.contains('placed'))return; placeItem(it,b); });
    chipBtns.push(b); chipsRow.appendChild(b);
  });

  function drawMarkers(){
    markerG.textContent='';
    placed.forEach((p,i)=>{
      const x=xFor(p.value);
      const yLab=axisY-14-(i%3)*15;
      markerG.appendChild(svgEl('line',{x1:x,y1:axisY,x2:x,y2:yLab+4,stroke:'#c08a1e','stroke-width':'1'}));
      const dot=svgEl('circle',{r:'5',cx:x,cy:axisY,fill:p.color||'#c08a1e',stroke:'#16233f','stroke-width':'1.2'}); markerG.appendChild(dot);
      const t=svgEl('text',{x:x,y:yLab,'text-anchor':'middle','font-size':'12',fill:'#16233f','font-family':'"Iowan Old Style",Palatino,serif'});
      t.textContent=(i+1)+'. '+p.label; markerG.appendChild(t);
    });
  }
  function refreshReadout(){
    readout.innerHTML = placed.length ? 'Order: <b>'+placed.map(p=>p.label).join(', ')+'</b>' : 'Click the values in order from least to greatest.';
  }
  function placeItem(it,btn){
    btn.classList.add('placed'); btn.setAttribute('aria-disabled','true');
    placed.push({value:it.value,label:it.label,color:null});
    drawMarkers(); refreshReadout(); onChange&&onChange();
  }
  clear.addEventListener('click',reset);
  function reset(){ placed=[]; chipBtns.forEach(b=>{b.classList.remove('placed');b.removeAttribute('aria-disabled');}); drawMarkers(); refreshReadout(); onChange&&onChange(); }

  refreshReadout();
  wrap.appendChild(chipsRow); wrap.appendChild(readout);
  const clearRow=document.createElement('div'); clearRow.className='answer-row'; clearRow.appendChild(clear); wrap.appendChild(clearRow);

  return {
    node:wrap,
    hasAnswer:()=>placed.length===items.length,
    isCorrect:()=>{ if(placed.length!==items.length)return false; for(let i=1;i<placed.length;i++){if(placed[i].value<placed[i-1].value)return false;} return true; },
    mark:(ok)=>{ placed.forEach(p=>p.color=ok?'#256d4f':'#b23b2e'); drawMarkers(); },
    reset:reset,
    needMsg:'Click all four values, least to greatest.'
  };
}

/* ================= Quiz data ================= */
const BANDS = [
  { band:"3.0", label:"Score", name:"Basic Understanding", sections:[
    { code:"1.1", title:"Converting Rational Numbers", directive:"Convert each number as directed. Write fractions in simplest form.", qs:[
      { no:1, prompt:'Write as a decimal: <span class="math">5/8</span>', label:"=", hint:"e.g. 0.5", type:'text', check:valCheck(0.625,1e-6), why:"5 \u00f7 8 = 0.625. It terminates, so it is rational." },
      { no:2, prompt:'Write as a fraction: <span class="math">0.75</span>', label:"=", hint:"simplest form, e.g. 3/4", type:'text', check:valCheck(0.75,1e-6), why:"0.75 = 75/100 = 3/4 in simplest form." },
    ]},
    { code:"1.2", title:"Real Number Classification", directive:"Classify the number as Rational (R) or Irrational (IR).", qs:[
      { no:3, prompt:'Classify: <span class="math">\u221a169</span>', label:"Classification:", hint:"type R or IR", type:'text', check:classCheck('R'), why:"\u221a169 = 13, a whole number, so it is rational." },
    ]},
  ]},
  { band:"4.0", label:"Score", name:"Target Content", sections:[
    { code:"1.1", title:"Converting Rational Numbers", directive:"Convert each number as directed. Write fractions in simplest form.", qs:[
      { no:4, prompt:'Write as a fraction: <span class="math">0.3&#773;</span> <span class="hint" style="display:inline">(the 3 repeats)</span>', label:"=", hint:"simplest form", type:'text', check:valCheck(1/3,1e-4), why:"Let x = 0.333\u2026, then 10x \u2212 x = 3, so 9x = 3 and x = 1/3." },
      { no:5, prompt:'Write as a decimal: <span class="math">2&#8531;</span> <span class="hint" style="display:inline">(2 and 1/3)</span>', label:"=", hint:"use \u2026 for the repeating part", type:'text', check:valCheck(2.3333,0.005), why:"2 1/3 = 2 + 1/3 = 2.333\u2026 (the 3 repeats)." },
    ]},
    { code:"1.2", title:"Real Number Classification", directive:"Classify the number as Rational (R) or Irrational (IR).", qs:[
      { no:6, prompt:'Classify: <span class="math">\u221a50</span>', label:"Classification:", hint:"type R or IR", type:'text', check:classCheck('IR'), why:"50 is not a perfect square, so \u221a50 = 5\u221a2 \u2248 7.07\u2026 \u2014 non-terminating and non-repeating, so irrational." },
    ]},
    { code:"1.2b", hideCode:true, directive:"<em>Simplify each expression first,</em> then classify the result.", qs:[
      { no:7, prompt:'Classify: <span class="math">\u221a2 \u00d7 \u221a8</span>', label:"Classification:", hint:"simplify, then R or IR", type:'text', check:classCheck('R'), why:"\u221a2 \u00d7 \u221a8 = \u221a16 = 4, a whole number, so rational." },
      { no:8, prompt:'Classify: <span class="math">\u221a75 \u00f7 \u221a3</span>', label:"Classification:", hint:"simplify, then R or IR", type:'text', check:classCheck('R'), why:"\u221a75 \u00f7 \u221a3 = \u221a25 = 5, a whole number, so rational." },
    ]},
    { code:"1.3", title:"Estimating Non-Perfect Square Roots", directive:"Estimate each value to the <em>nearest tenth</em> by clicking the number line.", qs:[
      { no:9, prompt:'Estimate: <span class="math">\u221a28</span>', type:'numberline', lo:5, hi:6, target:5.3, why:"5\u00b2 = 25 and 6\u00b2 = 36, so \u221a28 \u2248 5.29, which rounds to 5.3." },
      { no:10, prompt:'Estimate: <span class="math">\u221a60</span>', type:'numberline', lo:7, hi:8, target:7.7, why:"7\u00b2 = 49 and 8\u00b2 = 64, so \u221a60 \u2248 7.75, which rounds to 7.7." },
    ]},
  ]},
  { band:"5.0", label:"Score", name:"Advanced Content", sections:[
    { code:"1.2", title:"Real Number Classification", directive:"Evaluate or simplify each expression if possible, then classify as Rational (R) or Irrational (IR).", qs:[
      { no:11, prompt:'Classify: <span class="math">2 + \u221a16</span>', label:"Classification:", hint:"simplify, then R or IR", type:'text', check:classCheck('R'), why:"\u221a16 = 4, so 2 + \u221a16 = 6, an integer, so rational." },
      { no:12, prompt:'Classify: <span class="math">5 + \u221a7</span>', label:"Classification:", hint:"type R or IR", type:'text', check:classCheck('IR'), why:"\u221a7 is irrational, and a rational number (5) plus an irrational number is irrational." },
    ]},
    { code:"1.4", title:"Ordering Real Numbers", directive:"Click the values in order from <em>least to greatest</em>. Each one drops onto the number line.", qs:[
      { no:13, prompt:'Set: <span class="math">{ 0.8, \u221a3, 1.2, 7/5 }</span>', type:'order', lo:0, hi:4,
        items:[{label:'0.8',value:0.8},{label:'\u221a3',value:Math.sqrt(3)},{label:'1.2',value:1.2},{label:'7/5',value:7/5}],
        why:"As decimals: 0.8, \u221a3 \u2248 1.73, 1.2, 7/5 = 1.4 \u2192 least to greatest: 0.8, 1.2, 7/5, \u221a3." },
    ]},
    { code:"1.5", title:"Area", garden:true, directive:"A square garden has an area of 196 ft\u00b2. Find the side length and the perimeter.", qs:[
      { no:14, prompt:'Find the side length and perimeter of the square garden.', type:'multi',
        multi:[ {label:"Side length =",hint:"ft",check:valCheck(14,0.01)}, {label:"Perimeter =",hint:"ft",check:valCheck(56,0.01)} ],
        why:"Side = \u221a196 = 14 ft. Perimeter = 4 \u00d7 14 = 56 ft." },
    ]},
  ]},
];

/* ================= Render ================= */
const quiz=document.getElementById('quiz');
const registry=[];

function makeInput(hint){ const i=document.createElement('input'); i.type='text'; i.className='answer'; i.autocomplete='off'; i.setAttribute('aria-label','Your answer'); if(hint)i.placeholder=hint; return i; }
function verdict(fb,cls,msg,why){ fb.className='feedback show '+cls; fb.innerHTML='<span class="verdict">'+msg+'</span>'+(why?'<div class="why">'+why+'</div>':''); }

BANDS.forEach(b=>{
  const banner=document.createElement('div'); banner.className='band';
  banner.innerHTML=`<span class="lbl">${b.label}</span><span class="num">${b.band}</span><span class="name">${b.name}</span>`;
  quiz.appendChild(banner);

  b.sections.forEach(sec=>{
    const head=document.createElement('div'); head.className='subsec';
    head.innerHTML=sec.hideCode?'':`<span class="code">${sec.code}</span><span class="title">${sec.title}</span>`;
    quiz.appendChild(head);
    if(sec.directive){const d=document.createElement('p');d.className='directive';d.innerHTML=sec.directive;quiz.appendChild(d);}
    if(sec.garden){const g=document.createElement('div');g.className='garden';g.innerHTML='A = 196 ft<sup>2</sup>';quiz.appendChild(g);}

    sec.qs.forEach(q=>{
      const card=document.createElement('section'); card.className='q';
      const qhead=document.createElement('div'); qhead.className='q-head';
      qhead.innerHTML=`<span class="q-no">${q.no}.</span><span class="q-prompt">${q.prompt}</span>`;
      card.appendChild(qhead);

      const fb=document.createElement('div'); fb.className='feedback'; fb.setAttribute('aria-live','polite');
      let entry;

      if(q.type==='numberline'){
        const nl=buildNumberLine(q.lo,q.hi,()=>{});
        card.appendChild(nl.node);
        entry={ card, why:q.why, comp:nl,
          hasAnswer:()=>nl.hasAnswer(),
          isCorrect:()=>nl.hasAnswer()&&Math.abs(nl.getValue()-q.target)<1e-9,
          applyMark:(ok)=>nl.mark(ok),
          reset:()=>nl.reset(),
          needMsg:'Tap a mark on the number line first.' };
      }
      else if(q.type==='order'){
        const oc=buildOrderLine(q.items,q.lo,q.hi,()=>{});
        card.appendChild(oc.node);
        entry={ card, why:q.why, comp:oc,
          hasAnswer:()=>oc.hasAnswer(),
          isCorrect:()=>oc.isCorrect(),
          applyMark:(ok)=>oc.mark(ok),
          reset:()=>oc.reset(),
          needMsg:oc.needMsg };
      }
      else if(q.type==='multi'){
        const inputs=[];
        q.multi.forEach(f=>{ const row=document.createElement('div');row.className='answer-row';
          const lab=document.createElement('span');lab.className='field-label';lab.textContent=f.label;
          const inp=makeInput(f.hint);inp._check=f.check;row.appendChild(lab);row.appendChild(inp);card.appendChild(row);inputs.push(inp);});
        entry={ card, why:q.why, inputs,
          hasAnswer:()=>inputs.every(i=>i.value.trim()!==''),
          isCorrect:()=>inputs.every(i=>i.value.trim()!==''&&i._check(i.value.trim())),
          applyMark:(ok)=>inputs.forEach(i=>{i.classList.remove('ok','no');if(i.value.trim()!=='')i.classList.add(i._check(i.value.trim())?'ok':'no');}),
          reset:()=>inputs.forEach(i=>{i.value='';i.classList.remove('ok','no');}),
          needMsg:'Fill in both blanks first.' };
      }
      else { // text
        const row=document.createElement('div');row.className='answer-row';
        const lab=document.createElement('span');lab.className='field-label';lab.textContent=q.label;
        const inp=makeInput('');inp._check=q.check;row.appendChild(lab);row.appendChild(inp);card.appendChild(row);
        if(q.hint){const h=document.createElement('div');h.className='hint';h.textContent=q.hint;card.appendChild(h);}
        entry={ card, why:q.why, inputs:[inp],
          hasAnswer:()=>inp.value.trim()!=='',
          isCorrect:()=>inp.value.trim()!==''&&inp._check(inp.value.trim()),
          applyMark:(ok)=>{inp.classList.remove('ok','no');if(inp.value.trim()!=='')inp.classList.add(ok?'ok':'no');},
          reset:()=>{inp.value='';inp.classList.remove('ok','no');},
          needMsg:'Type an answer first.' };
      }

      // Check button
      const btnRow=document.createElement('div');btnRow.className='answer-row';
      const btn=document.createElement('button');btn.className='check-btn';btn.type='button';btn.textContent='Check';
      btnRow.appendChild(btn);card.appendChild(btnRow);
      card.appendChild(fb);

      entry.feedbackEl=fb;
      entry.evaluate=function(){
        card.classList.remove('correct','incorrect');
        if(!entry.hasAnswer()){ verdict(fb,'fail',entry.needMsg); return; }
        const ok=entry.isCorrect(); entry.applyMark(ok);
        if(ok){ card.classList.add('correct'); verdict(fb,'pass','Correct.',entry.why); }
        else { card.classList.add('incorrect'); verdict(fb,'fail','Not quite — try again.'); }
      };
      btn.addEventListener('click',()=>{entry.evaluate();updateScore();});
      (entry.inputs||[]).forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();entry.evaluate();updateScore();}}));

      registry.push(entry);
      quiz.appendChild(card);
    });
  });
});

/* ================= Score ================= */
const bar=document.getElementById('bar'), chip=document.getElementById('chip'), total=registry.length;
function updateScore(){ let c=0; registry.forEach(e=>{if(e.card.classList.contains('correct'))c++;}); chip.textContent=`${c} / ${total} correct`; bar.style.width=(c/total*100)+'%'; }

document.getElementById('checkAll').addEventListener('click',()=>{
  registry.forEach(e=>{ if(e.hasAnswer()) e.evaluate(); });
  updateScore();
  const t=registry.find(e=>!e.card.classList.contains('correct'));
  if(t)t.card.scrollIntoView({behavior:'smooth',block:'center'});
});
document.getElementById('reset').addEventListener('click',()=>{
  registry.forEach(e=>{ e.reset(); e.card.classList.remove('correct','incorrect'); e.feedbackEl.className='feedback'; e.feedbackEl.innerHTML=''; });
  updateScore(); window.scrollTo({top:0,behavior:'smooth'});
});
updateScore();
</script>
</body>
</html>
