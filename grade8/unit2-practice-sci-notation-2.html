0³ seconds in an hour. How many meters does sound travel in 3 hours?", "ans": "3.672 × 10⁶", "lv": 5, "choices": ["3.672 × 10⁵", "36.72 × 10⁵", "3.672 × 10⁶", "1.224 × 10⁶"], "why": {"1.224 × 10⁶": "That is the distance for ONE hour. The question asks about 3 hours.", "3.672 × 10⁵": "3.4 × 3.6 = 12.24. Moving the decimal to get 1.224 raises the exponent from 5 to 6.", "36.72 × 10⁵": "That is not in scientific notation yet. The first number must be less than 10: 3.672 × 10⁶."}}, {"n": 4, "q": "A stadium holds 6 × 10⁴ fans. Each ticket costs 5 × 10¹ dollars. Ava says a sold-out game brings in 3 × 10⁵ dollars. Is that reasonable?", "ans": "No. 6 × 5 = 30 and 10⁴ × 10¹ = 10⁵, so it is 30 × 10⁵ = 3 × 10⁶ dollars.", "lv": 5, "choices": ["Yes. 6 × 5 = 30, so it starts with 3, and the exponent is 4 + 1 = 5.", "No. It is 3 × 10⁴ dollars, because 4 × 1 = 4.", "Yes. 60,000 fans times $50 is about $300,000.", "No. 6 × 5 = 30 and 10⁴ × 10¹ = 10⁵, so it is 30 × 10⁵ = 3 × 10⁶ dollars."], "why": {"Yes. 6 × 5 = 30, so it starts with 3, and the exponent is 4 + 1 = 5.": "30 × 10⁵ must be rewritten. 30 = 3 × 10, so the exponent goes up to 6.", "No. It is 3 × 10⁴ dollars, because 4 × 1 = 4.": "To multiply powers of 10, ADD the exponents: 4 + 1 = 5. Do not multiply them.", "Yes. 60,000 fans times $50 is about $300,000.": "60,000 × 50 = 3,000,000. Count the zeros again."}}]}]}};</script>
