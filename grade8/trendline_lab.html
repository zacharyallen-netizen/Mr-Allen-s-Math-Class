<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trendline Lab — Unit 7 | Mr. Allen's 8th Grade Math</title>
<meta name="description" content="Trendline Lab: you are a data scientist. Read the pattern, fit the line, and make the call. Scatter plots, lines of best fit, y = mx + b, and two-way tables (NC.8.SP.1–4).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F5; --surface:#FFFFFF; --line:#E3E5EA; --line2:#C9CDD6;
  --navy:#1E2D4F; --ink:#2B3345; --muted:#5B6478;
  --gold:#FFC107; --goldText:#8A6100; --goldSoft:#FFF4D1;
  --ok:#15803D; --okSoft:#ECF7EF; --err:#B42318; --errSoft:#FDF0EE; --info:#1D4ED8; --infoSoft:#EEF3FD;
  --serif:'Source Serif 4', Georgia, serif;
  --sans:Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
.wrap{max-width:1040px;margin:0 auto;padding:16px 16px 56px}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--navy);margin:0}
h1{font-size:clamp(28px,5vw,40px);line-height:1.15}
h2{font-size:24px;line-height:1.2}
h3{font-size:19px;line-height:1.25}
p{margin:0 0 10px}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.back{display:inline-flex;align-items:center;min-height:44px;color:var(--navy);text-decoration:none;font-weight:500}
.back:hover{text-decoration:underline}
.label{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:28px 0 14px}
.label::after{content:"";flex:1;height:1px;background:var(--line)}
.hero{padding:8px 0 4px}
.hero h1{position:relative;display:inline-block;padding-bottom:6px}
.hero h1::after{content:"";position:absolute;left:0;bottom:0;width:64px;height:3px;background:var(--gold);border-radius:2px}
.hero .lede{max-width:640px;margin-top:12px;color:var(--ink)}
.stds{font-family:var(--mono);font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:#fff;font:600 15px/1.2 var(--sans);cursor:pointer;text-decoration:none;transition:box-shadow .15s}
.btn:hover{box-shadow:0 4px 14px rgba(22,33,58,.12)}
.btn.sec{background:#fff;color:var(--navy);border-color:var(--line2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--navy);padding:10px 8px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
/* station picker */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.st-card{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;cursor:pointer;font:inherit;color:inherit;min-height:150px;transition:box-shadow .15s,border-color .15s}
.st-card:hover:not(:disabled){box-shadow:0 4px 14px rgba(22,33,58,.08);border-color:var(--line2)}
.st-card:disabled{cursor:not-allowed;background:#FBFBFA}
.st-card .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st-num{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.st-card h3{font-size:21px}
.st-card .desc{color:var(--ink);font-size:15px;line-height:1.45}
.st-card:disabled h3,.st-card:disabled .desc{color:#8C93A3}
.st-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding-top:6px}
.tag{font-family:var(--mono);font-size:12px;color:var(--goldText);background:var(--goldSoft);border-radius:4px;padding:2px 6px}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
/* intro */
.how p{font-size:17px}
/* stage */
.stage-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:4px 0 14px}
.stage-top .ttl{flex:1;min-width:180px}
.stage-top .ttl .st-num{display:block}
.prog{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.bar{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.lab{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.lab{grid-template-columns:1fr}}
.lab.wide{grid-template-columns:1fr}
.lab.wide>.panel{order:-1}
.tray:empty{display:none}
.plotcard{padding:14px 14px 8px}
@media (min-width:861px){.lab:not(.wide)>.plotcard{position:sticky;top:12px}}
.ctx{font-size:15px;color:var(--ink);margin:0 0 6px}
.ctx b{color:var(--navy)}
.plotbox{width:100%}
svg.plot{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
svg.plot.drag{touch-action:none}
svg.plot text{font-family:var(--mono);fill:var(--muted)}
svg.plot .axlab{font-family:var(--sans);fill:var(--ink);font-weight:500}
svg.plot .pt{fill:var(--navy);fill-opacity:.85;stroke:#fff;stroke-width:1.2}
svg.plot .pt:focus{outline:none;stroke:var(--info);stroke-width:3}
svg.plot.tap{cursor:crosshair}
svg.plot .handle{cursor:grab;outline:none}
svg.plot .handle .hit{fill:transparent}
svg.plot .handle .knob{fill:#fff;stroke:var(--navy);stroke-width:2.5}
svg.plot .handle .core{fill:var(--gold)}
svg.plot .handle:focus .knob{stroke:var(--info);stroke-width:3.5}
svg.plot .handle.locked{cursor:default}
.panel{display:flex;flex-direction:column;gap:14px}
.panel .card{padding:16px}
.q{font-weight:600;color:var(--navy);margin-bottom:8px;font-size:17px}
.sub{font-size:15px;color:var(--muted);margin-bottom:10px}
.choices{display:flex;flex-direction:column;gap:8px}
.choices.row{flex-direction:row;flex-wrap:wrap}
.choices.row .choice{flex:1 1 120px;justify-content:center}
.choice{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;padding:10px 14px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink);font:500 15px/1.4 var(--sans);text-align:left;cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--navy)}
.choice:disabled{cursor:default;opacity:1}
.choice.right{border-color:var(--ok);background:var(--okSoft);color:#0F5A2B}
.choice.wrong{border-color:var(--err);background:var(--errSoft);color:#7A1A12}
.choice.dim{opacity:.6}
.choice svg{flex:none}
.fb{display:none;margin-top:10px;padding:10px 12px;border-radius:6px;border-left:3px solid var(--info);background:var(--infoSoft);font-size:15px}
.fb.show{display:block}
.fb.ok{border-color:var(--ok);background:var(--okSoft)}
.fb.err{border-color:var(--err);background:var(--errSoft)}
.fb.tip{border-color:var(--gold);background:var(--goldSoft)}
.fields{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.field{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:15px}
.field label{font-family:var(--serif);font-size:17px;color:var(--navy)}
input.box{width:5.2em;min-height:44px;padding:6px 8px;border:1px solid var(--line2);border-radius:6px;font:16px var(--mono);text-align:center;color:var(--ink);background:#fff}
input.box.wide{width:100%;max-width:300px;text-align:left}
input.box.good{border-color:var(--ok);background:var(--okSoft)}
input.box.bad{border-color:var(--err);background:var(--errSoft)}
input.box:disabled{color:var(--ink);-webkit-text-fill-color:var(--ink);opacity:1}
.steplab{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.work{margin-top:10px;font-family:var(--mono);font-size:14px;color:var(--ink);background:#FAFAF8;border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:none}
.work.show{display:block}
.eq{font-family:var(--serif);font-size:18px;color:var(--navy);white-space:nowrap}
.eq i{font-style:italic}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 2px;font-size:.92em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.meter{margin-top:6px}
.meter .track{position:relative;height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:6px}
.meter .ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:3px}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:15px;padding:4px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border-bottom:none}
.stat b{font-family:var(--mono);font-weight:600;color:var(--navy)}
.tiptext{font-size:14px;color:var(--muted);margin:8px 0 0}
.score-chip{font-family:var(--mono);font-size:13px;color:var(--muted)}
.studentwork{font-family:var(--mono);background:#FAFAF8;border:1px dashed var(--line2);border-radius:6px;padding:10px 12px;margin:8px 0;font-size:15px}
/* two-way table */
.tw{border-collapse:collapse;width:100%;font-size:15px;margin:4px 0 10px}
.tw th,.tw td{border:1px solid var(--line);padding:6px 8px;text-align:center}
.tw th{background:#FAFAF8;color:var(--navy);font-weight:600}
.tw th.rowh{text-align:left}
.tw td{font-family:var(--mono)}
.tw .tot{background:#FBFBFA;font-weight:600}
.tw input.box{width:100%;max-width:5.6em;min-width:3.6em;padding:6px 4px;font-size:15px}
@media (max-width:480px){.tw th,.tw td{padding:5px 4px}}
.tablewrap{overflow-x:auto}
.cap{font-size:13px;color:var(--muted);margin:2px 0 6px}
/* end */
.endcard{max-width:640px}
.bigstars svg{width:48px;height:48px}
.kpis{display:flex;gap:24px;flex-wrap:wrap;margin:14px 0}
.kpi .v{font-family:var(--mono);font-size:28px;color:var(--navy);font-weight:600}
.kpi .k{font-size:13px;color:var(--muted)}
.foot{margin-top:28px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;min-height:44px;padding:0 4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.backs{display:flex;gap:4px 20px;flex-wrap:wrap}
/* worked example */
.ex{border-left:3px solid var(--gold)}
.ex-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.ex-grid{grid-template-columns:1fr}}
.ex ol{margin:0;padding-left:22px}
.ex li{margin:0 0 8px;font-size:16px}
.ex svg{display:block;width:100%;height:auto;max-width:360px}
.ex .tw{max-width:360px}
/* sorting board (station 1) */
.board{display:flex;flex-direction:column;gap:16px}
.tray{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;min-height:60px}
@media (max-width:640px){.tray{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
.pc{display:flex;flex-direction:column;gap:4px;padding:8px;background:#fff;border:1px solid var(--line2);border-radius:8px;cursor:grab;font:inherit;color:inherit;text-align:left;touch-action:none;transition:box-shadow .15s,border-color .15s}
.pc:hover{border-color:var(--navy)}
.pc.sel{border-color:var(--info);box-shadow:0 0 0 2px var(--info)}
.pc .cap2{font-size:13px;line-height:1.3;color:var(--ink);min-height:34px}
.pc .cap2 b{color:var(--navy);font-weight:600}
.pc svg{display:block;width:100%;height:auto}
.pc.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.9;box-shadow:0 10px 24px rgba(22,33,58,.18);width:180px}
.pc.placed{cursor:default;padding:4px;border-color:var(--ok)}
.pc.placed .cap2{font-size:12px;min-height:0;overflow-wrap:anywhere;hyphens:auto}
.pc.done-none{opacity:.75}
.bins{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px}
.bin{display:flex;flex-direction:column;align-items:stretch;gap:6px;min-height:120px;padding:10px;border:1.5px dashed var(--line2);border-radius:8px;background:#FBFBFA;font:inherit;color:inherit;cursor:pointer;text-align:left}
.bin:hover,.bin.over{border-color:var(--navy);background:#F3F5F9}
.bin.armed{border-color:var(--info);border-style:solid}
.bin .bh{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--navy);font-size:15px;line-height:1.25}
.bin .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
@media (max-width:640px){.bin .slots{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}}
.bin .slots .pc{width:100%}
@media (max-width:480px){.bin{padding:8px;min-height:104px}.bin .bh{font-size:14px;flex-direction:column;align-items:flex-start;gap:2px}}
/* lab report */
.report td,.report th{text-align:left}
.report td.num{font-family:var(--mono);text-align:right}
@media (max-width:480px){
  .card{padding:14px}
  .plotcard{padding:10px 8px 6px}
  .bar{width:90px}
  h2{font-size:22px}
}
</style>

<script>
'use strict';
/* ================= utilities ================= */
const NS='http://www.w3.org/2000/svg';
function h(tag,attrs,...kids){

function S(tag,attrs,parent){const e=document.createElementNS(NS,tag); if(attrs) for(const k in attrs){ if(attrs[k]!=null) e.setAttribute(k,attrs[k]); } if(parent) parent.appendChild(e); return e;}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

}; return o;}
const roundTo=(v,d)=>+(Math.round(v/d)*d).toFixed(6);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fmt(v,dp=2){ if(!isFinite(v)) return '?'; let r=Math.round(v*Math.pow(10,dp))/Math.pow(10,dp); if(Object.is(r,-0)||Math.abs(r)<1e-12) r=0; return String(r).replace('-','−'); }
function money(v){ const a=Math.abs(v); const s=Math.abs(a-Math.round(a))<1e-9?String(Math.round(a)):a.toFixed(2); return (v<0?'−':'')+'$'+s; }
function sgnWord(v){return v<0?'−':'';}
function eqHTML(m,b){
  let s='<span class="eq"><i>y</i> = ';
  const am=Math.abs(m);

  s+=(m<0?'−':'')+(Math.abs(am-1)<1e-12?'':fmt(am))+'<i>x</i>';

function fracHTML(a,b){return `<span class="frac"><span>${a}</span><span>${b}</span></span>`;}
function norm(s){return String(s==null?'':s).trim().toLowerCase().replace(/≈/g,'=').replace(/[−–—‒]/g,'-').replace(/\s+/g,' ');}
function parseFrac(k){const m=String(k).match(/^(\d*\.?\d+)(?:\/(\d*\.?\d+))?$/); if(!m) return NaN; const a=parseFloat(m[1]); if(m[2]==null) return a; const d=parseFloat(m[2]); return d===0?NaN:a/d;}
/* Number box: accepts -12, −12, 1/2, 0.5, "x = 5", "13 units", "$12.50", "45%", "70°F" */
function parseNum(raw){

/* percent or decimal → percent */
function parsePct(raw){ const s=norm(raw); const v=parseNum(s); if(!isFinite(v)) return NaN; if(s.includes('%')) return v; return Math.abs(v)<=1?v*100:v; }
/* y = mx + b in many forms → {m,b} or null */
function parseLine(raw){

const NICE=[1,2,5,10,20,25,50,100,200,250,500,1000];
function niceAxis(lo,hi,maxT,zero){
  for(const minGap of [0.15,0.06]){
    for(const st of NICE){
      let mn=Math.floor(lo/st+1e-9)*st; if(lo-mn<0.3*st) mn-=st;
      if(zero||(lo>=0&&mn<0)){ if(lo<minGap*st) continue; mn=0; }
      let mx=Math.ceil(hi/st-1e-9)*st; if(mx-hi<0.3*st) mx+=st;
      const n=Math.round((mx-mn)/st);
      if(n<=maxT) return {min:mn,max:mx,step:st,n};
    }
  }
  const st=1000; const mn=Math.max(0,Math.floor(lo/st)*st-st), mx=Math.ceil(hi/st)*st+st; return {min:mn,max:mx,step:st,n:Math.round((mx-mn)/st)};
}
function axesFor(pts,o={}){

  const ya=niceAxis(lo,hi,o.maxY||8,zeroY), dmax=Math.max(...ys);

function stratX(r,n,lo,hi,dx){const xs=[]; for(let i=0;i<n;i++){xs.push(roundTo(lo+(i+r.range(0.1,0.9))/n*(hi-lo),dx));} return xs.map(x=>clamp(x,lo,hi));}
function dedupe(pts,dy){const seen=new Set(); return pts.filter(p=>{const k=p.x+'|'+p.y; if(seen.has(k)) return false; seen.add(k); return true;});}
function genLinear(c,r,o={}){
  const n=o.n||r.int(12,16), sdm=o.sd==null?1:o.sd;
  let last=null;
  for(let t=0;t<120;t++){
    const m=o.m!=null?o.m:r.range(c.m[0],c.m[1]);
    const b=o.b!=null?o.b:(c.bf?c.bf(m,r):r.range(c.b[0],c.b[1]));
    const xs=stratX(r,n,c.xr[0],c.xr[1],c.dx);
    const pts=xs.map(x=>({x,y:roundTo(m*x+b+r.normal()*c.sd*sdm,c.dy)}));
    last={pts,m,b};
    if(pts.every(p=>p.y>=c.yB[0]&&p.y<=c.yB[1])) return {pts:dedupe(pts),m,b};
  }
  last.pts.forEach(p=>p.y=clamp(p.y,c.yB[0],c.yB[1])); last.pts=dedupe(last.pts); return last;
}
function genNone(c,r){
  for(let t=0;t<60;t++){const n=r.int(14,18); const xs=stratX(r,n,c.xr[0],c.xr[1],c.dx);
    const pts=dedupe(r.shuffle(xs).map(x=>({x,y:roundTo(r.range(c.yr[0],c.yr[1]),c.dy)})));
    if(Math.abs(corr(pts))<0.15) return pts;}
  return Array.from({length:14},(_,i)=>({x:roundTo(c.xr[0]+i/13*(c.xr[1]-c.xr[0]),c.dx),y:roundTo(c.yr[0]+((i*7)%14)/13*(c.yr[1]-c.yr[0]),c.dy)}));
}
function genCurve(c,r){const f=c.gen(r); const n=r.int(14,17); const xs=stratX(r,n,c.xr[0],c.xr[1],c.dx);
  return {f,pts:dedupe(xs.map(x=>{const y=f(x); const sd=c.abs!=null?c.abs:c.rel*y; return {x,y:roundTo(Math.max(c.dy,y+r.normal()*sd),c.dy)};}))};}

  }
  function place(i,k){

/* ================= Station 2: Spot It ================= */
function planSpot(r){return {kinds:r.shuffle(['out','out','clu','clu']),keys:r.shuffle(Object.keys(LIN))};}
function makeSpot(r,i,plan){
  const kind=plan.kinds[i]; const key=plan.keys[i%plan.keys.length]; const c=LIN[key];
  if(kind==='out'){
    for(let t=0;t<80;t++){
      const g=genLinear(c,r,{n:r.int(12,14),sd:0.55}); const pts=g.pts.slice().sort((a,b)=>a.x-b.x);
      const k=r.int(Math.floor(pts.length*0.25),Math.floor(pts.length*0.75));
      const ys=pts.map(q=>q.y), span=(Math.max(...ys)-Math.min(...ys))||c.sd*6;
      const pred=g.m*pts[k].x+g.b; let dir=r.next()<0.5?1:-1;
      let mag=Math.max(6*c.sd,0.45*span);
      let y=roundTo(pred+dir*mag,c.dy);
      if(y<c.yB[0]||y>c.yB[1]){dir=-dir; y=roundTo(pred+dir*mag,c.dy);}
      if(y<c.yB[0]||y>c.yB[1]) continue;
      pts[k]={x:pts[k].x,y,out:true};
      const others=pts.filter(q=>!q.out); const fit=lsq(others);
      const maxOther=Math.max(...others.map(q=>Math.abs(q.y-(fit.m*q.x+fit.b))));
      if(Math.abs(y-(fit.m*pts[k].x+fit.b))<4*maxOther) continue;
      return {kind,key,c,pts,outIdx:k,fit,...axesFor(pts,{ycap:c.ycap})};
    }
  }
  // cluster
  const g0=genLinear(c,r,{n:4,sd:0.1}); const m=g0.m,b=g0.b;
  for(let t=0;t<80;t++){
    const R=c.xr[1]-c.xr[0]; const xc=c.xr[0]+R*r.range(0.28,0.72);
    const cl=[]; const nC=r.int(8,10);
    const spanY=Math.abs(m)*R+4*c.sd;
    for(let j=0;j<nC;j++){const x=roundTo(clamp(xc+r.normal()*0.04*R,c.xr[0],c.xr[1]),c.dx); cl.push({x,y:roundTo(m*x+b+r.normal()*0.03*spanY,c.dy),cl:true});}
    const others=[]; const nO=r.int(6,7); let guard=0;
    while(others.length<nO&&guard++<200){const x=roundTo(r.range(c.xr[0],c.xr[1]),c.dx); if(Math.abs(x-xc)<0.22*R) continue; others.push({x,y:roundTo(m*x+b+r.normal()*c.sd*1.3,c.dy)});}
    const pts=dedupe(cl.concat(others));
    if(!pts.every(q=>q.y>=c.yB[0]&&q.y<=c.yB[1])) continue;
    if(pts.filter(q=>q.cl).length<7) continue;
    return {kind:'clu',key,c,pts,...axesFor(pts,{ycap:c.ycap})};
  }
  return makeSpot(RNG(hashSeed(i,99,r.int(1,1e6))),i,{kinds:['out','out','out','out'],keys:plan.keys});
}
function renderSpot(it,ui){
  const c=it.c, isOut=it.kind==='out';
  ui.ctx.innerHTML=`<b>${c.xl}</b> and <b>${c.yl.replace(/ \(.*\)$/,'')}</b>.`;
  const p=makePlot(ui.plotBox,{xa:it.xa,ya:it.ya,xl:c.xl,yl:c.yl,cls:'tap'}); SES.plot=p;
  const circles=drawPts(p,it.pts,{focusable:true,lab:q=>`${c.fx(q.x)}, ${c.fy(q.y)}`});
  // cluster ellipse (pixel space)
  let ell=null;
  if(!isOut){const cp=it.pts.filter(q=>q.cl); const xs=cp.map(q=>p.X(q.x)), ys=cp.map(q=>p.Y(q.y));
    const cx=(Math.min(...xs)+Math.max(...xs))/2, cy=(Math.min(...ys)+Math.max(...ys))/2;
    ell={cx,cy,rx:(Math.max(...xs)-Math.min(...xs))/2+22,ry:(Math.max(...ys)-Math.min(...ys))/2+22};}
  const marker=S('g',{style:'display:none','pointer-events':'none'},p.gTop);
  S('circle',{r:15,fill:'none',stroke:'#1D4ED8','stroke-width':2.5},marker); S('circle',{r:2.5,fill:'#1D4ED8'},marker);
  let sel=null, done=false;
  function select(px,py,idx){ if(done) return; sel={px,py,idx}; marker.style.display=''; marker.setAttribute('transform',`translate(${px},${py})`); checkBtn.disabled=false; fb.className='fb'; }
  p.svg.addEventListener('pointerdown',e=>{ if(done) return; const q=svgPt(p.svg,e);
    if(q.x<p.L-6||q.x>p.R+6||q.y<p.T-6||q.y>p.B+6) return;
    let best=-1,bd=1e9; it.pts.forEach((pt,i)=>{const d=Math.hypot(p.X(pt.x)-q.x,p.Y(pt.y)-q.y); if(d<bd){bd=d;best=i;}});
    if(isOut){ if(bd<=30) select(p.X(it.pts[best].x),p.Y(it.pts[best].y),best); else { fb.className='fb show tip'; fb.textContent='Tap right on a dot.'; } }
    else select(q.x,q.y,bd<=14?best:-1);
  });
  circles.forEach((cEl,i)=>cEl.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); if(sel&&sel.idx===i&&!done){check();} else select(p.X(it.pts[i].x),p.Y(it.pts[i].y),i);} }));
  const card=h('div',{class:'card'},h('div',{class:'steplab'},isOut?'Find the outlier':'Find the cluster'),
    h('div',{class:'q'},isOut?'Tap the outlier.':'Tap the cluster.'),
    h('div',{class:'sub'},isOut?'An outlier is a dot that is far away from the pattern of the other dots.':'A cluster is a group of dots packed close together.'));
  const checkBtn=h('button',{class:'btn',type:'button',disabled:true},'Check');
  const fb=h('div',{class:'fb',role:'status'});
  card.append(h('div',{class:'btn-row'},checkBtn),fb, h('p',{class:'tiptext'},'Keyboard: press Tab to move between dots. Press Enter to pick a dot, then Enter again to check.'));
  ui.panel.append(card);
  let wrong=0;
  function check(){
    if(!sel||done) return;

    if(isOut) ok=sel.idx===it.outIdx;

      drawLine(p,p.gUnder,it.fit.m,it.fit.b,{stroke:'#FFC107','stroke-width':2.5,'stroke-dasharray':'7 6'});
      S('circle',{cx:p.X(q.x),cy:p.Y(q.y),r:13,fill:'none',stroke:'#B42318','stroke-width':2.5},p.gTop);
      S('line',{x1:p.X(q.x),y1:p.Y(q.y),x2:p.X(q.x),y2:p.Y(pred),stroke:'#B42318','stroke-width':1.5,'stroke-dasharray':'3 3'},p.gTop);
      const predR=roundTo(pred,c.dy<1?0.5:1);
      fb.className='fb show '+(ok?'ok':'err');
      fb.innerHTML=(ok?(wrong===0?'Correct. ':'Yes. '):'Here it is, circled in red. ')+`This dot is the outlier. It is far from the pattern of the other dots. At ${c.fx(q.x)}, the pattern is near ${c.fy(predR)}, but this dot is at ${c.fy(q.y)}.`;
    } else {
      S('ellipse',{cx:ell.cx,cy:ell.cy,rx:ell.rx-6,ry:ell.ry-6,fill:'rgba(255,193,7,.12)',stroke:'#B98900','stroke-width':2,'stroke-dasharray':'6 5'},p.gUnder);
      const cp=it.pts.filter(q=>q.cl); const x1=Math.min(...cp.map(q=>q.x)),x2=Math.max(...cp.map(q=>q.x)),y1=Math.min(...cp.map(q=>q.y)),y2=Math.max(...cp.map(q=>q.y));
      fb.className='fb show '+(ok?'ok':'err');
      fb.innerHTML=(ok?(wrong===0?'Correct. ':'Yes. '):'Here it is, inside the dashed oval. ')+`A cluster is a group of dots packed close together. Here, ${cp.length} dots sit between ${c.fx(x1)} and ${c.fx(x2)}, with ${c.yw} from ${c.fy(y1)} to ${c.fy(y2)}.`;
    }
  }
}

/* ================= handles (Fit It / Write It) ================= */
function makeHandles(p,init,o){
  const Hs=init.map(q=>({x:q.x,y:q.y}));
  p.svg.classList.add('drag');
  const line=S('line',{stroke:'#1E2D4F','stroke-width':3,'stroke-linecap':'round'},p.gOver);
  const gH=S('g',null,p.gTop);
  let locked=false;
  const snap=q=>o.snap?{x:p.xa.min+Math.round((q.x-p.xa.min)/p.xa.step)*p.xa.step,y:p.ya.min+Math.round((q.y-p.ya.min)/p.ya.step)*p.ya.step}:q;
  const clampQ=q=>({x:clamp(q.x,p.xa.min,p.xa.max),y:clamp(q.y,p.ya.min,p.ya.max)});
  function tryMove(i,q){ q=snap(clampQ(q)); q={x:+q.x.toFixed(6),y:+q.y.toFixed(6)}; const other=Hs[1-i];
    if(Math.abs(p.X(q.x)-p.X(other.x))<(o.snap?1:24)) q.x=Hs[i].x; // keep handles apart
    Hs[i]=q; draw(); }
  const els=Hs.map((q,i)=>{
    const g=S('g',{class:'handle',tabindex:0,role:'slider','aria-label':`Line handle ${i+1}. Use arrow keys to move.`},gH);
    S('circle',{r:26,class:'hit'},g); S('circle',{r:11,class:'knob'},g); S('circle',{r:4,class:'core'},g);
    let drag=false;
    g.addEventListener('pointerdown',e=>{ if(locked) return; drag=true; try{g.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); g.focus({preventScroll:true}); });
    g.addEventListener('pointermove',e=>{ if(!drag||locked) return; const s=svgPt(p.svg,e); tryMove(i,{x:p.iX(s.x),y:p.iY(s.y)}); });
    const up=e=>{drag=false; try{g.releasePointerCapture(e.pointerId);}catch(_){} };
    g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up);
    g.addEventListener('keydown',e=>{ if(locked) return; const big=e.shiftKey?5:1;
      const sx=o.snap?p.xa.step:(p.xa.max-p.xa.min)/60*big, sy=o.snap?p.ya.step:(p.ya.max-p.ya.min)/60*big;
      const d={ArrowLeft:[-sx,0],ArrowRight:[sx,0],ArrowUp:[0,sy],ArrowDown:[0,-sy]}[e.key];
      if(d){e.preventDefault(); tryMove(i,{x:Hs[i].x+d[0],y:Hs[i].y+d[1]});}
      if(e.key==='Enter'&&o.onEnter){e.preventDefault(); o.onEnter();}
    });
    return g;});
  function mb(){const a=Hs[0],b=Hs[1]; const m=(b.y-a.y)/(b.x-a.x); return {m,b:a.y-m*a.x};}
  function draw(){ els.forEach((g,i)=>g.setAttribute('transform',`translate(${p.X(Hs[i].x)},${p.Y(Hs[i].y)})`));
    const L=mb(); const x1=p.xa.min-(p.xa.max-p.xa.min), x2=p.xa.max+(p.xa.max-p.xa.min);
    line.setAttribute('x1',p.X(x1)); line.setAttribute('y1',p.Y(L.m*x1+L.b)); line.setAttribute('x2',p.X(x2)); line.setAttribute('y2',p.Y(L.m*x2+L.b));
    if(o.onChange) o.onChange(L); }
  for(let i=0;i<2;i++) Hs[i]=snap(clampQ(Hs[i]));
  draw();
  return {Hs,els,line,mb,draw,set(i,q){Hs[i]=snap(clampQ(q)); draw();},lock(){locked=true; els.forEach(g=>{g.classList.add('locked'); g.setAttribute('aria-disabled','true');}); p.svg.classList.remove('drag');}};
}
function fitStars(ratio){return ratio<=1.2?3:ratio<=1.5?2:1;}

/* ================= Station 3: Fit It ================= */
function makeFit(r,i,plan){
  const key=plan[i%plan.length]; const c=LIN[key];
  const g=genLinear(c,r,{n:r.int(12,16),sd:r.range(0.8,1.2)});
  const best=lsq(g.pts); const ax=axesFor(g.pts,{ycap:c.ycap});
  return {key,c,pts:g.pts,best,bestMae:mae(g.pts,best.m,best.b),...ax,startY:r.range(0.4,0.6),startTilt:r.range(-0.08,0.08)};
}
function planFit(r){return r.shuffle(Object.keys(LIN)).slice(0,4);}
function renderFit(it,ui){
  const c=it.c, unit=c.yl.match(/\((.*)\)/); const yUnit=c.yu||(unit?unit[1]:'units');
  ui.ctx.innerHTML=`<b>${c.xl}</b> and <b>${c.yl.replace(/ \(.*\)$/,'')}</b>. Drag the two round handles.`;
  const p=makePlot(ui.plotBox,{xa:it.xa,ya:it.ya,xl:c.xl,yl:c.yl}); SES.plot=p;
  drawPts(p,it.pts);
  const balEl=h('b'), tiltEl=h('b');
  const card=h('div',{class:'card'},h('div',{class:'steplab'},'Fit the line'),
    h('div',{class:'q'},'Place a line of best fit.'),
    h('div',{class:'sub'},'Rule of thumb: follow the direction of the cloud. Keep about as many dots above the line as below it.'),
    h('div',{style:'margin-top:4px'},
      h('div',{class:'stat'},h('span',{},'Dots above · below your line'),balEl),
      h('div',{class:'stat'},h('span',{},'Your line goes'),tiltEl)),
    h('p',{class:'tiptext'},'The line does not have to touch any dot. When you are happy, lock it in. Then you see your stars and a good line to compare.'));
  const lockBtn=h('button',{class:'btn',type:'button',id:'lockBtn'},'Lock in my line');
  const fb=h('div',{class:'fb',role:'status'});
  card.append(h('div',{class:'btn-row'},lockBtn),fb); ui.panel.append(card);
  const xa=it.xa, ya=it.ya, yMid=ya.min+(ya.max-ya.min)*it.startY, tilt=(ya.max-ya.min)*it.startTilt;
  let cur=null;
  const H=makeHandles(p,[{x:xa.min+(xa.max-xa.min)*0.22,y:yMid-tilt},{x:xa.min+(xa.max-xa.min)*0.78,y:yMid+tilt}],{snap:false,onEnter:()=>lock(),onChange:L=>{
    cur=L; const ab=it.pts.filter(q=>q.y>L.m*q.x+L.b).length; balEl.textContent=`${ab} · ${it.pts.length-ab}`;
    const steep=Math.abs(L.m)*(xa.max-xa.min)/(ya.max-ya.min);
    tiltEl.textContent=steep<0.05?'flat':L.m>0?'up (left to right)':'down (left to right)';
    SES.fitNow={ratio:mae(it.pts,L.m,L.b)/it.bestMae,L};
  }});
  SES.handles=H;
  lockBtn.addEventListener('click',lock);
  let lockedOnce=false;
  function lock(){
    if(lockedOnce) return; lockedOnce=true; H.lock(); lockBtn.disabled=true;
    const L=cur, u=mae(it.pts,L.m,L.b), ratio=u/it.bestMae, st=fitStars(ratio);
    SES.fit.push(st); ui.record(st>=2);
    // residuals + best line
    it.pts.forEach(q=>S('line',{x1:p.X(q.x),y1:p.Y(q.y),x2:p.X(q.x),y2:p.Y(L.m*q.x+L.b),stroke:'#B42318','stroke-width':1.6,opacity:.7},p.gUnder));
    drawLine(p,p.gUnder,it.best.m,it.best.b,{stroke:'#1D4ED8','stroke-width':2.5,'stroke-dasharray':'9 7',opacity:.45});
    const ab=it.pts.filter(q=>q.y>L.m*q.x+L.b).length, be=it.pts.length-ab;
    let advice='';
    if(Math.sign(L.m)!==Math.sign(it.best.m)&&Math.abs(it.best.m)>1e-9) advice=`Your line slants the wrong way. The cloud goes ${it.best.m>0?'up':'down'} from left to right.`;
    else if(Math.abs(L.m)<Math.abs(it.best.m)*0.75) advice='Your line is too flat. Make it steeper to follow the cloud.';
    else if(Math.abs(L.m)>Math.abs(it.best.m)*1.33) advice='Your line is too steep. Tilt it to follow the cloud.';
    else if(ab>be*1.8+1) advice='Most dots are above your line. Slide it up.';
    else if(be>ab*1.8+1) advice='Most dots are below your line. Slide it down.';

    fb.innerHTML='';
    fb.append(h('div',{},starRow(st,22)),h('p',{style:'margin:6px 0 0'},`${head} Your line misses by ${u.toFixed(1)} ${yUnit} on average. The best line misses by ${it.bestMae.toFixed(1)}.`+(advice?' '+advice:'')),
      h('p',{style:'margin:6px 0 0',class:'muted'},'The faint blue dashed line is a very good line (the least-squares line). The short red lines show how far each dot is from your line, straight up or down.'));
    ui.finish();
  }
}

/* ================= Station 4: Write it ================= */
const WRITE_KEYS=['study','taxi','tree','cocoa','absences','freethrow','battery'];
function planWrite(r){return r.shuffle(WRITE_KEYS).slice(0,4);}
const isDp=(v,dp)=>Math.abs(v*Math.pow(10,dp)-Math.round(v*Math.pow(10,dp)))<1e-7;
function makeWrite(r,i,plan){
  const key=plan[i]; const c=LIN[key];
  for(let t=0;t<80;t++){
    const g=genLinear(c,r,{n:r.int(11,14),sd:0.8}); const best=lsq(g.pts), bestMae=mae(g.pts,best.m,best.b);
    const ax=axesFor(g.pts,{zeroX:true,extraY:[best.b],maxX:12,maxY:10,ycap:c.ycap});
    const xa=ax.xa, ya=ax.ya; if(xa.min!==0) continue;
    const cands=[];
    for(let a=1;a<xa.n;a++) for(let e=a+Math.ceil(xa.n*0.4);e<xa.n;e++) for(let j=1;j<ya.n;j++) for(let k=1;k<ya.n;k++){
      const x1=xa.min+a*xa.step,x2=xa.min+e*xa.step,y1=ya.min+j*ya.step,y2=ya.min+k*ya.step;
      const m=(y2-y1)/(x2-x1), b=y1-m*x1;
      if(!isDp(m,2)||!isDp(b,1)||Math.abs(m)<1e-9) continue;
      if(b<ya.min||b>ya.max) continue;
      const ratio=mae(g.pts,m,b)/bestMae; if(ratio>1.25) continue;
      cands.push({x1,y1,x2,y2,m:+m.toFixed(4),b:+b.toFixed(4),ratio,span:e-a});
    }
    if(!cands.length) continue;
    cands.sort((p,q)=>p.ratio-q.ratio||q.span-p.span);
    const pick=cands[Math.min(cands.length-1,r.int(0,2))];
    const A={x:pick.x1,y:pick.y1}, B={x:pick.x2,y:pick.y2};
    const rise=+(B.y-A.y).toFixed(6), run=+(B.x-A.x).toFixed(6);
    return {key,c,pts:g.pts,best,bestMae,...ax,ans:{A,B,rise,run,m:pick.m,b:pick.b,ratio:pick.ratio}};
  }
}
function renderWrite(it,ui){
  const c=it.c, a=it.ans, xa=it.xa, ya=it.ya;
  ui.ctx.innerHTML=`<b>${c.xl}</b> and <b>${shortLab(c.yl)}</b>. The line of best fit goes through two grid points, A and B.`;
  const p=makePlot(ui.plotBox,{xa,ya,xl:c.xl,yl:c.yl}); SES.plot=p; SES.ans=a;
  drawPts(p,it.pts);
  drawLine(p,p.gOver,a.m,a.b,{stroke:'#1E2D4F','stroke-width':2.5});

function planTable(r){const kinds=r.shuffle(['assoc',r.pick(['assoc','assoc-trap']),'none-trap','none']); return {kinds,ctx:r.shuffle(TBL.map((_,i)=>i)),pats:kinds.map(()=>r.pick(['A','B','C']))};}
function makeTable(r,i,plan){
  const kind=plan.kinds[i], ctx=TBL[plan.ctx[i]];
  const sizes=[40,60,80,100,120];
  let n1,n2,p1,p2;
  for(let t=0;t<200;t++){
    n1=r.pick(sizes); n2=r.pick(sizes);
    if(kind.endsWith('trap')&&Math.abs(n1-n2)<40) continue;
    if(kind.startsWith('assoc')){ p1=5*r.int(4,17); p2=5*r.int(4,17); if(Math.abs(p1-p2)<25) continue;
      if(kind==='assoc-trap'){ // the group with the LOWER percent has MORE yes-count
        const c1=p1*n1/100,c2=p2*n2/100; if(!((p1<p2&&c1>c2)||(p2<p1&&c2>c1))) continue; }
    } else { p1=5*r.int(6,15); p2=p1+r.pick([-5,0,5]); if(p2<20||p2>85) continue;
      if(kind==='none-trap'&&Math.abs(p1*n1-p2*n2)/100<10) continue; }
    if((p1*n1)%100||(p2*n2)%100) continue;
    break;
  }
  const a=[[p1*n1/100,n1-p1*n1/100],[p2*n2/100,n2-p2*n2/100]];
  const tot={r1:n1,r2:n2,c1:a[0][0]+a[1][0],c2:a[0][1]+a[1][1],g:n1+n2};
  return {kind,ctx,a,tot,p:[[p1,100-p1],[p2,100-p2]],assoc:kind.startsWith('assoc'),pat:plan.pats[i]};
}

    h('tr',{},h('th',{class:'rowh'},ctx.rows[1]),cell(1,0),cell(1,1),tcell('r2',tot.r2,`${ctx.rows[1]} total`)),
    h('tr',{},h('th',{class:'rowh'},'Total'),tcell('c1',tot.c1,`${ctx.cols[0]} total`),tcell('c2',tot.c2,`${ctx.cols[1]} total`),tcell('g',tot.g,'grand total')));
  box.append(h('div',{class:'cap'},'Counts (number of students)'),h('div',{class:'tablewrap'},tbl));
  const truth={r1:tot.r1,r2:tot.r2,c1:tot.c1,c2:tot.c2,g:tot.g,a01:a[0][1],a10:a[1][0]};
  const st1=boxStep(ui.panel,{lab:'Step 1 · Totals',q:'Fill in the missing boxes in the table.',sub:'Add across a row for the row total. Add down a column for the column total.',fields:[],extInputs:inputs,

    check:v=>{const bad=[]; let msg='';
      for(const k in v){ const n=parseNum(v[k]); if(!near(n,truth[k],1e-9)){ bad.push(k);
        if(!msg){ if(k==='r1'||k==='r2'){const i=k==='r1'?0:1; msg=`Add across the ${ctx.rows[i]} row: ${a[i][0]} + ${a[i][1]}.`;}
          else if(k==='c1'||k==='c2'){const j=k==='c1'?0:1; msg=`Add down the ${ctx.cols[j]} column.`;}
          else if(k==='g') msg='The grand total = the two row totals added (it also equals the two column totals added).';
          else msg='For the missing count, subtract: row total − the other count in that row.'; } } }
      return bad.length?{ok:false,bad,msg}:{ok:true,msg:`There are ${tot.g} students in all.`};},
    answers:()=>{const o={}; for(const k in inputs) o[k]=String(truth[k]); return o;},
    work:()=>`${ctx.rows[0]}: ${a[0][0]} + ${a[0][1]} = ${tot.r1} · ${ctx.rows[1]}: ${a[1][0]} + ${a[1][1]} = ${tot.r2}<br>Grand total: ${tot.r1} + ${tot.r2} = ${tot.g}`,
    onDone:step2});
  st1.focus();
  function step2(){

    const t2=h('table',{class:'tw'},
      h('tr',{},h('th',{}),h('th',{},ctx.cols[0]),h('th',{},ctx.cols[1]),h('th',{},'Total')),
      h('tr',{},h('th',{class:'rowh'},ctx.rows[0]),h('td',{},mk2('p00',`${ctx.rows[0]} ${ctx.cols[0]} percent`)),h('td',{},mk2('p01',`${ctx.rows[0]} ${ctx.cols[1]} percent`)),h('td',{class:'tot'},'100%')),
      h('tr',{},h('th',{class:'rowh'},ctx.rows[1]),h('td',{},mk2('p10',`${ctx.rows[1]} ${ctx.cols[0]} percent`)),h('td',{},mk2('p11',`${ctx.rows[1]} ${ctx.cols[1]} percent`)),h('td',{class:'tot'},'100%')));
    box.append(h('div',{class:'cap',style:'margin-top:12px'},'Row relative frequencies (percent of each row)'),h('div',{class:'tablewrap'},t2));
    const P=it.p;
    const st=boxStep(ui.panel,{lab:'Step 2 · Row percents',q:'Find the relative frequency for each box, by row.',sub:'Relative frequency = part ÷ total. For a row percent, divide each count by its <b>row total</b>, then × 100. Type a percent (like 75%) or a decimal (like 0.75).',
      fields:[],extInputs:pin,hint:`Example: ${a[0][0]} ÷ ${tot.r1} = ${fmt(a[0][0]/tot.r1,2)} = ${fmt(P[0][0])}%. Each row should add to 100%.`,
      check:v=>{const bad=[]; let msg='';
        for(const k in v){const i=+k[1],j=+k[2]; const pv=parsePct(v[k]);

              else if(near(pv,a[i][j]/tot.g*100,0.6)) msg='You divided by the grand total. For a row percent, divide by the ROW total.';
              else if(near(pv,a[i][j],1e-9)) msg='That is the count. Divide it by the row total, then × 100.';

        return bad.length?{ok:false,bad,msg}:{ok:true,msg:'Each row adds to 100%.'};},
      answers:()=>({p00:P[0][0]+'%',p01:P[0][1]+'%',p10:P[1][0]+'%',p11:P[1][1]+'%'}),
      work:()=>`${ctx.rows[0]}: ${a[0][0]} ÷ ${tot.r1} = ${P[0][0]}% · ${a[0][1]} ÷ ${tot.r1} = ${P[0][1]}%<br>${ctx.rows[1]}: ${a[1][0]} ÷ ${tot.r2} = ${P[1][0]}% · ${a[1][1]} ÷ ${tot.r2} = ${P[1][1]}%`,

  function step3(){

        {t:'No. The row percents are about the same.',fb:`Look again. ${P[0][0]}% and ${P[1][0]}% are far apart.`},
        {t:'You cannot tell, because the groups are different sizes.',fb:'You can tell. Percents let you compare groups of different sizes.'}];

  }
