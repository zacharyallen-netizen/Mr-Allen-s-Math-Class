<!DOCTYPE html>

<head>

<title>Lesson 5: Energy Pyramid: Powers of 10 · Math in Science</title>
<meta name="description" content="Use powers of 10 and exponent rules to model how energy decreases at each level of a food web. NC.8.EE.1 with LS.8.2.4.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<script src="../../site-bar.js"></script>
<main class="page-wrap" id="ms-app"></main>
<div class="site-footer">© Mr. Allen's Math Class · Math in Science</div>
<script src="ms.js"></script>
<script>
(function () {
var Q = MS.Q, sv = MS.sv;
var LEVELS = ['Producers', 'Primary consumers', 'Secondary consumers', 'Tertiary consumers'];
var EX = ['marsh grass', 'snail', 'blue crab', 'heron'];   // NC estuary example

function pyramidFig(el) {
  var host = MS.h('div'), ctl = MS.h('div', { class: 'ms-ctrl' }), read = MS.h('div', { class: 'ms-read' });
  el.appendChild(host); el.appendChild(ctl); el.appendChild(read);
  function draw(k) {
    host.innerHTML = '';
    var W = 560, H = 300, svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'ms-svg', role: 'img', 'aria-label': 'Energy pyramid with four levels' });
    var cols = ['#CFE8D5', '#FFE9A8', '#FFD08A', '#F4B183'];
    for (var i = 0; i < 4; i++) {
      var y1 = 270 - i * 62, y0 = y1 - 58, wb = 520 - i * 120, wt = wb - 120 * 58 / 62, cx = W / 2;
      sv('path', { d: 'M' + (cx - wb / 2) + ' ' + y1 + ' L' + (cx + wb / 2) + ' ' + y1 + ' L' + (cx + wt / 2) + ' ' + y0 + ' L' + (cx - wt / 2) + ' ' + y0 + ' Z', fill: cols[i], stroke: '#1E2D4F', 'stroke-width': 1.5 }, svg);
      sv('text', { x: cx, y: y0 + 25, 'text-anchor': 'middle', 'font-size': i === 3 ? 14 : 16, 'font-weight': 600 }, svg, i === 3 ? 'Level 4' : LEVELS[i] + ' (' + EX[i] + ')');
      sv('text', { x: cx, y: y0 + 47, 'text-anchor': 'middle', 'font-size': i === 3 ? 15 : 17, class: 'mono' }, svg, '10' + MS.sup(k - i) + (i === 3 ? '' : ' = ' + MS.fmt(Q.str(Q.pow10(k - i)))));
    }
    host.appendChild(svg);
    read.innerHTML = 'Producers: 10' + MS.sup(k) + ' units. Each level up: × 10⁻¹. Level 4: 10' + MS.sup(k) + ' × 10⁻³ = <b>10' + MS.sup(k - 3) + '</b> = ' + MS.fmt(Q.str(Q.pow10(k - 3))) + ' units.';
  }
  MS.slider(ctl, 'Energy in producers (power of 10)', 3, 6, 1, 4, function (v) { return '10' + MS.sup(v); }, draw);
}
function decayFig(el) {
  var P = MS.plot(el, { x: [0, 4], y: [0, 10000], xt: 1, yt: 2000, l: 74, xl: 'Level number above producers (x)', yl: 'Energy (units)', label: 'Graph of y = 10000 times 0.1 to the x' });
  P.fn(function (x) { return 10000 * Math.pow(0.1, x); }, { stroke: '#1D4ED8' });
  for (var x = 0; x <= 4; x++) P.dot(x, 10000 * Math.pow(0.1, x), { r: 6 });
  P.text(1.1, 3000, 'y = 10000(0.1)ˣ', { fill: '#1D4ED8', 'font-weight': 600 });
}

MS.lesson({
  num: 5, title: 'Energy Pyramid: Powers of 10', sci: 'LS.8.2.4', math: ['NC.8.EE.1'], minutes: 6,
  question: 'Plants capture energy from the sun. How much of it reaches the animals at the top of a food web?',
  intro: 'Only about 10% of the energy passes up to each new level. Powers of 10 make this easy to track.',
  target: 'I can use powers of 10 to model how energy decreases at each level of a food web.',
  vocab: ['producer', 'consumer', 'decomposer', 'trophic level', 'energy pyramid', '10% rule', 'exponent', 'power of 10'],
  steps: [
    { title: 'The 10% rule',
      body: '<p>Producers (plants) capture energy. When an animal eats, only about <b>10%</b> of the energy passes up. The other 90% is used for life (moving, growing) or lost as heat.</p>' +
        '<div class="ms-ex"><span class="lbl">Example</span>10,000 → 1,000 → 100 → 10 units. Each level has one tenth of the level below it.</div>',
      fig: pyramidFig,
      tryit: { type: 'num', unit: 'units', q: 'A level has 1,000 units of energy. About how many units pass up to the next level?', ans: Q.mul(1000, Q(1, 10)), show: '100',
        wrong: [['900', 'That is the energy that does not pass up. Only 10% passes up.'], ['10', 'That is 1%. Find 10% of 1,000.']],
        hint: '10% means divide by 10.', explain: '10% of 1,000 = 1,000 ÷ 10 = 100 units.' } },
    { title: 'Write each level as a power of 10',
      body: '<p>10,000 = 10⁴, 1,000 = 10³, 100 = 10², 10 = 10¹. Going up one level <b>multiplies by 10⁻¹</b> (one tenth).</p>',
      tryit: { type: 'num', sci: true, q: 'Write 100,000 as a power of 10.', ans: Q(100000), show: '10⁵', accept: ['10^5', '1x10^5'],
        wrong: [['10^6', 'Count the zeros in 100,000. There are 5.'], ['10^4', 'Count the zeros in 100,000. There are 5.']],
        hint: 'Count the zeros.', explain: '100,000 has 5 zeros, so 100,000 = 10⁵.' } },
    { title: 'Use exponent rules',
      body: '<p><b>Multiply</b> powers of 10: <b>add</b> the exponents. <b>Divide</b>: <b>subtract</b> the exponents.</p>' +
        '<div class="ms-ex"><span class="lbl">Worked examples</span><ul><li>Two levels up from 10⁴: 10⁴ × 10⁻² = 10⁴⁺⁽⁻²⁾ = <b class="num">10²</b></li><li>10⁴ ÷ 10¹ = 10⁴⁻¹ = <b class="num">10³</b></li></ul></div>',
      tryit: { type: 'num', sci: true, q: 'Simplify <span class="num">10⁶ × 10⁻³</span>. Write it as a power of 10.', ans: Q.mul(Q.pow10(6), Q.pow10(-3)), show: '10³', accept: ['10^3', '1000'],
        wrong: [['10^-18', 'You multiplied the exponents. When you multiply powers of 10, add the exponents.'], ['10^9', 'Check the sign: 6 + (−3) = 3.'], ['10^-2', '10⁶ × 10⁻³: add 6 and −3.']],
        hint: 'Add the exponents: 6 + (−3).', explain: '6 + (−3) = 3, so 10⁶ × 10⁻³ = 10³.' } },
    { title: 'Why the pyramid is short',
      body: '<p>The energy drops by a factor of 10 each level. The graph of <span class="num">y = 10000(0.1)ˣ</span> drops fast and is <b>not</b> a line.</p>',
      fig: decayFig,
      tryit: { type: 'mc', q: 'Why do food webs rarely have more than 4 or 5 levels?', choices: ['There is too little energy left at the top to support more animals.', 'Animals at the top make their own energy.', 'Energy is created at each level.'], ans: 0,
        why: { 1: 'Only producers capture energy from the sun. Animals must eat.', 2: 'Energy is not created. Most of it is lost as heat at each level.' },
        hint: 'Look at how fast the energy drops.', explain: 'After 4 levels, only about 0.1% of the energy is left. That is not enough to feed another level.' } }
  ],
  desmos: '<p>Make a table of level (x) and energy (y). Then type <code>y = 10000(0.1)^x</code>. The points fall on a curve, not a line.</p>',
  assignment: [
    { type: 'num', sci: true, std: 'NC.8.EE.1', unit: 'units', q: 'Producers capture <b>10⁶</b> units of energy. How much reaches the <b>4th level</b>? Write it as a power of 10.',
      ans: Q.mul(Q.pow10(6), Q.pow10(-3)), show: '10³ (1,000)', accept: ['10^3', '1000', '1x10^3'],
      wrong: [['10^2', 'From level 1 to level 4 is 3 steps, not 4. Multiply by 10⁻³.'], ['10^-18', 'You multiplied the exponents. Add them: 6 + (−3).'], ['10^5', 'That is only one step up. Level 4 is 3 steps up.']],
      hint: 'Level 1 → level 4 is 3 steps. Each step is × 10⁻¹. So multiply by 10⁻³.', explain: '10⁶ × 10⁻³ = 10⁶⁺⁽⁻³⁾ = 10³ = 1,000 units.' },
    { type: 'mc', std: 'NC.8.EE.1', q: 'Simplify <span class="num">10⁵ ÷ 10⁻²</span>.', choices: ['10³', '10⁷', '10⁻¹⁰', '10⁻⁷'], ans: 1,
      why: { 0: 'You did 5 − 2. Subtract the exponents: 5 − (−2) = 5 + 2.', 2: 'You multiplied the exponents. When you divide, subtract them.', 3: 'Check the sign: 5 − (−2) = +7.' },
      hint: 'Divide: subtract the exponents. 5 − (−2).', explain: '5 − (−2) = 7, so 10⁵ ÷ 10⁻² = 10⁷.' },
    { type: 'sel', std: 'NC.8.EE.1', q: 'Select <b>all</b> expressions equal to <b>10²</b>.', choices: ['10⁴ × 10⁻²', '10⁶ ÷ 10⁴', '(10¹)²', '10⁻²', '10⁸ ÷ 10⁴'], ans: [0, 1, 2],
      why: { 3: '10⁻² = 1/100 = 0.01. That is not 100.', 4: '10⁸ ÷ 10⁴ = 10⁸⁻⁴ = 10⁴.' },
      hint: 'Simplify each one. Multiply → add exponents. Divide → subtract. Power of a power → multiply.', explain: '10⁴ × 10⁻² = 10², 10⁶ ÷ 10⁴ = 10², and (10¹)² = 10². ',
      check: function () { return Q.eq(Q.mul(Q.pow10(4), Q.pow10(-2)), 100) && Q.eq(Q.div(Q.pow10(6), Q.pow10(4)), 100) && !Q.eq(Q.div(Q.pow10(8), Q.pow10(4)), 100); } },
    { type: 'num', std: 'NC.8.EE.1', unit: 'units', q: 'The 3rd level (secondary consumers) gets 50 units of energy. About how much energy did the producers (level 1) have?',
      ans: Q.mul(50, Q.pow10(2)), show: '5,000', accept: ['5000', '5x10^3'],
      wrong: [['500', 'From level 3 down to level 1 is 2 steps. Multiply by 10 two times.'], ['0.5', 'Going down the pyramid, energy gets bigger. Multiply, do not divide.'], ['50000', 'Level 3 to level 1 is 2 steps, not 3.']],
      hint: 'Going down one level multiplies by 10. Level 3 → level 1 is 2 steps.', explain: '50 × 10² = 50 × 100 = 5,000 units.' },
    { type: 'mc', std: 'LS.8.2.4', q: 'At each level, about 90% of the energy does not pass up. Where does most of it go?',
      choices: ['It is used for life processes and lost as heat.', 'It is destroyed.', 'It goes back to the sun.', 'It is stored in the soil forever.'], ans: 0,
      why: { 1: 'Energy is never destroyed. It changes form. Most becomes heat.', 2: 'Energy does not travel back to the sun.', 3: 'Decomposers do recycle matter, but most energy is lost as heat.' },
      hint: 'Energy cannot be created or destroyed. It changes form.', explain: 'Animals use energy to move, grow and stay warm. Most of it ends up as heat.' },
    { type: 'num', std: 'NC.8.EE.1', q: 'Each step up the pyramid multiplies the energy by <b>10⁻¹</b>. Write 10⁻¹ as a decimal.', ans: Q(1, 10), show: '0.1', accept: ['1/10', '.1', '10^-1'],
      wrong: [['-10', 'A negative exponent does not make a negative number. 10⁻¹ = 1/10.'], ['-0.1', 'A negative exponent does not make a negative number. 10⁻¹ = 1/10.'], ['10', '10⁻¹ is 1 divided by 10.']],
      hint: '10⁻¹ = 1 ÷ 10¹.', explain: '10⁻¹ = 1/10 = 0.1. That is the 10% rule.' },
    { type: 'err', std: 'NC.8.EE.1', q: 'Ava found the energy at level 4 when producers have 10⁶ units. <b>Which step has the first mistake?</b>',
      steps: ['Level 1 to level 4 is 3 steps, so multiply by 10⁻³: 10⁶ × 10⁻³', 'Multiply the exponents: 6 × (−3) = −18', 'Level 4 gets 10⁻¹⁸ units.'], ans: 1,
      why: { 0: 'This step is right. 3 steps of × 10⁻¹ is × 10⁻³.', 2: 'This step uses the answer from Step 2. The mistake is earlier.' },
      hint: 'What do you do with the exponents when you multiply powers of 10?', explain: 'Step 2 is wrong. When you multiply powers of 10, add the exponents: 6 + (−3) = 3. Level 4 gets 10³ units.' },
    { type: 'mc', std: 'NC.8.EE.1', q: 'Which equation models the energy y at level x above producers that start with 10,000 units?',
      choices: ['y = 10000(0.1)ˣ', 'y = 10000 − 0.1x', 'y = 10000 − 1000x', 'y = 0.1x'], ans: 0,
      why: { 1: 'This subtracts 0.1 each level. The energy is multiplied by 0.1 each level.', 2: 'This subtracts 1,000 each level. Check x = 2: it gives 8,000, but the real value is 100.', 3: 'At x = 0 this gives 0, but the producers have 10,000.' },
      hint: 'Each level multiplies by 0.1. Test x = 1: you should get 1,000.', explain: 'Multiplying by 0.1 each level gives y = 10000(0.1)ˣ: 10,000, 1,000, 100, 10.' }
  ],
  checks: [['10^4·10^-2 = 10^2', Q.eq(Q.mul(Q.pow10(4), Q.pow10(-2)), Q.pow10(2))], ['10^4 ÷ 10^1 = 10^3', Q.eq(Q.div(Q.pow10(4), Q.pow10(1)), Q.pow10(3))],
    ['10000·0.1^3 = 10', Q.eq(Q.mul(10000, Q.mul(Q('1', 10), Q.mul(Q(1, 10), Q(1, 10)))), 10)]],
  ixl: [['Math', 'Understanding negative exponents', 'NC.8.EE.1'], ['Math', 'Multiply and divide powers: integer bases', 'NC.8.EE.1'], ['Math', 'Evaluate expressions using properties of exponents', 'NC.8.EE.1'],
        ['Science', 'Trophic levels and energy pyramids', 'LS.8.2.4'], ['Science', 'Interpret food webs I', 'LS.8.2.2'], ['Science', 'The carbon cycle', 'LS.8.2.4']]
});
})();
</script>
