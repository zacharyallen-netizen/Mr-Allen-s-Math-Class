itely many solutions", "lv": 5}, {"n": 3, "q": "Why does 4(x − 1) + 2 = 4x − 2 have infinitely many solutions?", "ans": "After you simplify, both sides are exactly the same: 4x − 2.", "lv": 5, "choices": ["After you simplify, both sides are exactly the same: 4x − 2.", "The x-terms are the same, so there is no solution.", "x = 0 is the only solution.", "Any equation with 4x on both sides has infinitely many solutions."], "why": {"The x-terms are the same, so there is no solution.": "No solution needs DIFFERENT plain numbers. Here they match too: −2 and −2.", "x = 0 is the only solution.": "0 works, but so does every other number. Try x = 5: both sides equal 18.", "Any equation with 4x on both sides has infinitely many solutions.": "The plain numbers matter too. 4x − 2 = 4x + 1 has NO solution."}}]}, {"title": "E. Linear Inequalities", "std": "NC.8.EE.7", "hint": "Solve like an equation. If you multiply or divide by a negative number, flip the inequality sign.", "probs": [{"n": 1, "q": "Solve: 4x ≥ 32", "ans": "x ≥ 8", "lv": 3}, {"n": 2, "q": "Solve: 2x + 7 ≤ 19", "ans": "x ≤ 6", "lv": 3}, {"n": 3, "q": "Solve: −5x < 20 (careful!)", "ans": "x > −4", "lv": 4}, {"n": 4, "q": "Solve: −4x − 3 > 9 (careful!)", "ans": "x < −3", "lv": 5}]}, {"title": "F. Word Problems", "std": "NC.8.EE.7", "hint": "Write an equation: start-up amount + rate × (number) = total. Then solve.", "probs": [{"n": 1, "q": "A phone plan costs $20 plus $0.05 per text. If the bill was $35, how many texts were sent?", "ans": "300", "lv": 4}, {"n": 2, "q": "You have $60 and want to buy shirts that cost $12 each. What's the max number of shirts you can buy?", "ans": "5", "lv": 5}, {"n": 3, "q": "Plan A: $40 to join a club plus $10 each month. Plan B: $20 each month with no joining fee. After how many months do the two plans cost the same?", "ans": "4", "lv": 5}]}]}};</script>
