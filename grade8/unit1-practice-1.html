, so 3π/4 is not a ratio of two integers.", "lv": 5, "choices": ["Rational. 3 and 4 are integers.", "Irrational. Every fraction is irrational.", "Irrational. π is irrational, so 3π/4 is not a ratio of two integers.", "Rational. Any number written as a fraction is rational."], "why": {"Rational. Any number written as a fraction is rational.": "A fraction is rational only when the top and the bottom are both INTEGERS.", "Rational. 3 and 4 are integers.": "The top is 3π, not 3. π is irrational, so the top is not an integer.", "Irrational. Every fraction is irrational.": "Fractions of integers, like 3/4, are rational. This one is irrational because of π."}}]}, {"title": "C. Perfect Squares", "std": "NC.8.EE.2", "hint": "n² means n × n. √n asks: what number times itself makes n?", "probs": [{"n": 1, "q": "What is 12²?", "ans": "144", "lv": 3}, {"n": 2, "q": "What is √225?", "ans": "15", "lv": 3}]}, {"title": "D. Estimating Square Roots", "std": "NC.8.NS.2", "hint": "Find the perfect squares just below and just above the number. Then use the estimating algorithm: how far past the lower square is it, out of the gap between the two squares?", "probs": [{"n": 1, "q": "Between which two consecutive integers does √50 fall?", "ans": "7 and 8", "lv": 3}, {"n": 2, "q": "Estimate √50 to the nearest tenth.", "ans": "7.1", "lv": 4}, {"n": 3, "q": "Kai estimates √40 ≈ 6.3. Which check shows the estimate is good?", "ans": "6.3² = 39.69, which is very close to 40.", "lv": 5, "choices": ["6.3 × 2 = 12.6, which is not close to 40.", "40 ÷ 2 = 20, so 6.3 is too low.", "6² = 36 and 7² = 49, so any number from 6 to 7 is a good estimate.", "6.3² = 39.69, which is very close to 40."], "why": {"6.3 × 2 = 12.6, which is not close to 40.": "Squaring means 6.3 × 6.3, not 6.3 × 2.", "40 ÷ 2 = 20, so 6.3 is too low.": "√40 is not 40 ÷ 2. To check a square root, square your estimate.", "6² = 36 and 7² = 49, so any number from 6 to 7 is a good estimate.": "That only shows √40 is between 6 and 7. Squaring 6.3 shows how CLOSE it is."}}]}, {"title": "E. Ordering Rational & Irrational Numbers", "std": "NC.8.NS.2", "hint": "Turn everything into a decimal (estimate square roots), then compare.", "probs": [{"n": 1, "q": "Which is greater: √2 or <span class=\"fr\"><span>3</span><span>2</span></span>?", "ans": "<span class=\"fr\"><span>3</span><span>2</span></span>", "lv": 4}, {"n": 2, "q": "Order from least to greatest: √10, 3, <span class=\"fr\"><span>10</span><span>3</span></span>", "ans": "3, √10, <span class=\"fr\"><span>10</span><span>3</span></span>", "lv": 5}, {"n": 3, "q": "Which is greater: π or √10?", "ans": "√10", "lv": 5, "choices": ["π", "√10", "They are equal"]}, {"n": 4, "q": "Order from least to greatest: √30, ∛100, 5.3", "ans": "∛100, 5.3, √30", "lv": 5}]}]}};</script>
