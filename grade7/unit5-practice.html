<script>window.PRACTICE = {"unit": "7-5", "data": {"title": "Unit 5 Practice — Percents", "sub": "Percent basics · Change · Tax, tips & discounts · Interest · Error", "secs": [{"title": "A. Part, Percent, Whole", "std": "NC.7.RP.3", "hint": "part = percent × whole. Use the percent as a decimal.", "probs": [{"n": 1, "q": "What is 30% of 80?", "lv": 3, "hint": "0.3 × 80", "ans": "24"}, {"n": 2, "q": "18 is 40% of what number?", "lv": 4, "hint": "whole = 18 ÷ 0.40", "ans": "45", "choices": ["7.2", "45", "0.45", "720"], "why": {"7.2": "You found 40% of 18. Here 18 is the part.", "720": "You multiplied 18 × 40. Divide 18 by 0.40.", "0.45": "You divided 18 by 40, not by 0.40."}}, {"n": 3, "q": "A test has 55 points. Mia lost 20% of the points. How many points did she get?", "lv": 5, "hint": "20% of 55 = 11 points lost.", "ans": "44"}]}, {"title": "B. Percent Increase and Decrease", "std": "NC.7.RP.3", "hint": "change ÷ original × 100", "probs": [{"n": 1, "q": "From 50 to 35. What is the percent decrease?", "lv": 3, "hint": "15 ÷ 50", "ans": "30"}, {"n": 2, "q": "A $1,200 TV goes up to $1,500. What is the percent increase?", "lv": 4, "hint": "300 ÷ 1200", "ans": "25%", "choices": ["25%", "20%", "300%", "80%"], "why": {"20%": "You divided by the NEW price. Divide by the original, $1,200.", "300%": "300 is the change in dollars. Divide it by the original.", "80%": "That is 1,200 ÷ 1,500. Find the change first."}}, {"n": 3, "q": "A store pays $85 for a bike and marks it up 20%. What is the selling price in dollars?", "lv": 5, "hint": "1.20 × 85", "ans": "102"}]}, {"title": "C. Tax, Tips, Fees, Commission", "std": "NC.7.RP.3", "hint": "Add tax, tips and fees. Subtract discounts. Do them in order.", "probs": [{"n": 1, "q": "An 18% tip on a $24 bill. How much is the tip in dollars?", "lv": 3, "hint": "0.18 × 24", "ans": "4.32"}, {"n": 2, "q": "$45 with 6% sales tax. What is the total?", "lv": 4, "hint": "1.06 × 45", "ans": "$47.70", "choices": ["$45.06", "$47.70", "$2.70", "$51"], "why": {"$2.70": "That is the tax. Add it to $45.", "$51": "You added $6, not 6%.", "$45.06": "You added 6 cents. 6% of 45 is more."}}, {"n": 3, "q": "An $80 jacket is 20% off. Then 5% tax is added. What is the total in dollars?", "lv": 4, "hint": "0.80 × 80 = 64. Then 1.05 × 64.", "ans": "67.2"}, {"n": 4, "q": "Kim earns $300 a week plus 4% commission on her sales. She sold $2,500 this week. What did she earn in all (in dollars)?", "lv": 5, "hint": "Commission: 0.04 × 2500. Add the $300.", "ans": "400"}]}, {"title": "D. Simple Interest", "std": "NC.7.RP.3", "hint": "I = Prt. Rate as a decimal, time in years.", "probs": [{"n": 1, "q": "Find the interest on $500 at 4% for 3 years (in dollars).", "lv": 3, "hint": "500 × 0.04 × 3", "ans": "60"}, {"n": 2, "q": "What is the balance after $2,000 earns 3% simple interest for 5 years?", "lv": 4, "hint": "I = 2000 × 0.03 × 5. Then add it to 2000.", "ans": "$2,300", "choices": ["$2,300", "$300", "$32,000", "$2,060"], "why": {"$300": "That is the interest. Add it to the $2,000.", "$2,060": "That is only 1 year of interest. Multiply by 5 years.", "$32,000": "Use 3% as 0.03."}}, {"n": 3, "q": "How many years does it take $800 to earn $120 at 5% simple interest?", "lv": 5, "hint": "120 = 800 × 0.05 × t", "ans": "3"}]}, {"title": "E. Percent Error", "std": "NC.7.RP.3", "hint": "|estimate − actual| ÷ actual × 100", "probs": [{"n": 1, "q": "Guess 45, actual 50. What is the percent error?", "lv": 3, "hint": "5 ÷ 50", "ans": "10"}, {"n": 2, "q": "Guess 132, actual 120. What is the percent error?", "lv": 4, "hint": "12 ÷ 120", "ans": "10%", "choices": ["10%", "110%", "9.1%", "12%"], "why": {"9.1%": "You divided by the guess, 132. Divide by the actual, 120.", "12%": "12 is the difference. Divide it by 120.", "110%": "That is 132 ÷ 120. Find the difference first."}}, {"n": 3, "q": "A scale says a 50 kg bag weighs 48 kg. What is the percent error?", "lv": 5, "hint": "|48 − 50| ÷ 50", "ans": "4"}]}]}};</script>
