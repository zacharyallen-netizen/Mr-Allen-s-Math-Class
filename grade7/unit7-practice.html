<script>window.PRACTICE = {"unit": "7-7", "data": {"title": "Unit 7 Practice — Circles, Area, Surface Area and Volume", "sub": "Circumference · Circle area · Composite area · Surface area · Volume", "secs": [{"title": "A. Circumference", "std": "NC.7.G.4", "hint": "C = πd = 2πr. Use 3.14.", "probs": [{"n": 1, "q": "Find the circumference: diameter 5 in. Use 3.14.", "lv": 3, "hint": "3.14 × 5", "ans": "15.7"}, {"n": 2, "q": "A circle has radius 4 ft. Which is its circumference? Use 3.14.", "lv": 4, "hint": "C = 2 × 3.14 × 4", "ans": "25.12 ft", "choices": ["12.56 ft", "50.24 ft", "25.12 ft", "8 ft"], "why": {"12.56 ft": "You used the radius as the diameter. d = 8.", "50.24 ft": "That is the area (πr²).", "8 ft": "That is the diameter. Multiply by π."}}, {"n": 3, "q": "A wheel rolls 314 cm in 5 full turns. What is its diameter, in cm? Use 3.14.", "lv": 5, "hint": "One turn: 314 ÷ 5. Then d = C ÷ 3.14.", "ans": "20"}]}, {"title": "B. Area of a Circle", "std": "NC.7.G.4", "hint": "A = πr². Square the radius.", "probs": [{"n": 1, "q": "Find the area: radius 6 m. Use 3.14.", "lv": 3, "hint": "3.14 × 36", "ans": "113.04"}, {"n": 2, "q": "A circle has diameter 20 cm. What is its area? Use 3.14.", "lv": 4, "hint": "r = 10.", "ans": "314 cm²", "choices": ["62.8 cm²", "125.6 cm²", "1,256 cm²", "314 cm²"], "why": {"1,256 cm²": "You squared the diameter. r = 10.", "62.8 cm²": "That is the circumference.", "125.6 cm²": "You did 3.14 × 10 × 4. Square the radius: 10 × 10."}}, {"n": 3, "q": "A round rug with radius 3 ft lies on a 10 ft by 8 ft floor. How many ft² of floor are NOT covered? Use 3.14.", "lv": 5, "hint": "80 − 3.14 × 9", "ans": "51.74"}]}, {"title": "C. Composite Area", "std": "NC.7.G.6", "hint": "Break it into pieces. Add, or subtract a missing piece.", "probs": [{"n": 1, "q": "A rectangle 8 m by 5 m has a triangle on top with base 8 m and height 3 m. What is the total area, in m²?<div class=\"pr-figwrap\"><svg viewBox=\"0 0 230 180\" width=\"230\" height=\"180\" role=\"img\" aria-label=\"a rectangle 8 m by 5 m with a triangle 3 m tall on top\" style=\"max-width:100%;height:auto\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"context-stroke\"/></marker></defs><path d=\"M30,150 V80 H190 V150 Z\" fill=\"#F6E7C8\" stroke=\"#3E2414\" stroke-width=\"2.4\"/><path d=\"M30,80 L110,30 L190,80 Z\" fill=\"#FBE9C9\" stroke=\"#3E2414\" stroke-width=\"2.4\"/><line x1=\"110.0\" y1=\"30.0\" x2=\"110.0\" y2=\"80.0\" stroke=\"#B4541C\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/><text x=\"118.0\" y=\"62.0\" text-anchor=\"start\" font-size=\"13\" font-weight=\"600\" fill=\"#B4541C\" font-family=\"JetBrains Mono,ui-monospace,monospace\">3 m</text><text x=\"110.0\" y=\"168.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#B4541C\" font-family=\"JetBrains Mono,ui-monospace,monospace\">8 m</text><text x=\"20.0\" y=\"120.0\" text-anchor=\"end\" font-size=\"13\" font-weight=\"600\" fill=\"#B4541C\" font-family=\"JetBrains Mono,ui-monospace,monospace\">5 m</text></svg></div>", "lv": 3, "hint": "40 + 12", "ans": "52"}, {"n": 2, "q": "Which area is right for a trapezoid with bases 7 and 11 and height 6?", "lv": 4, "hint": "½ × (7 + 11) × 6", "ans": "54", "choices": ["54", "462", "108", "24"], "why": {"108": "You forgot the ½.", "462": "You multiplied all three. Add the bases first.", "24": "You added all three numbers."}}, {"n": 3, "q": "A 20 ft by 15 ft wall has a window 4 ft by 5 ft and a door 3 ft by 7 ft. How many ft² need paint?", "lv": 5, "hint": "300 − 20 − 21", "ans": "259"}]}, {"title": "D. Surface Area", "std": "NC.7.G.6", "hint": "Add the areas of ALL the faces.", "probs": [{"n": 1, "q": "A cube has 2 ft edges. What is its surface area, in ft²?", "lv": 3, "hint": "6 × 4", "ans": "24"}, {"n": 2, "q": "A box is 5 by 2 by 3. What is the surface area?", "lv": 4, "hint": "2(10 + 15 + 6)", "ans": "62 square units", "choices": ["62 square units", "31 square units", "10 square units", "30 square units"], "why": {"31 square units": "Each face has a matching face. Double it.", "30 square units": "That is the volume.", "10 square units": "You added the lengths."}}, {"n": 3, "q": "A tent is a triangular prism. The triangle ends have base 6 ft and height 4 ft, with slanted sides 5 ft. The tent is 10 ft long and has NO floor. How many ft² of cloth?", "lv": 5, "hint": "Two triangles + two 5 × 10 sides (no floor).", "ans": "124"}]}, {"title": "E. Volume", "std": "NC.7.G.6", "hint": "V = Bh. Use cubic units.", "probs": [{"n": 1, "q": "A box is 4 by 4 by 4. What is its volume?", "lv": 3, "hint": "4 × 4 × 4", "ans": "64"}, {"n": 2, "q": "A prism has a base area of 2 1/2 in² and is 8 in tall. What is its volume?", "lv": 4, "hint": "2.5 × 8", "ans": "20 in³", "choices": ["80 in³", "10.5 in³", "16 in³", "20 in³"], "why": {"10.5 in³": "You added. V = B × h.", "16 in³": "You used 2, not 2 1/2.", "80 in³": "2 1/2 × 8 is not 80. Think: 2 × 8 plus ½ × 8."}}, {"n": 3, "q": "A pool is 12 m long, 10 m wide and 8 m deep. It has water 5 m deep. How many m³ more water fit?", "lv": 5, "hint": "12 × 10 × 3", "ans": "360"}]}]}};</script>
