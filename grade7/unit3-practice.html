<script>window.PRACTICE = {"unit": "7-3", "data": {"title": "Unit 3 Practice — Equations and Inequalities", "sub": "Two-step · Parentheses · Word problems · Inequalities · Inequality stories", "secs": [{"title": "A. Two-Step Equations", "std": "NC.7.EE.4", "hint": "Undo + or − first, then × or ÷. Check your answer.", "probs": [{"n": 1, "q": "Solve: 6x + 11 = 47", "lv": 3, "hint": "Subtract 11. Then divide by 6.", "ans": "6"}, {"n": 2, "q": "Solve: x/5 + 2 = −3", "lv": 3, "hint": "Subtract 2. Then multiply by 5.", "ans": "-25"}, {"n": 3, "q": "Solve: −8 = 4 − 3x", "lv": 4, "hint": "Subtract 4 from both sides: −12 = −3x.", "ans": "x = 4", "choices": ["x = −4", "x = 4/3", "x = −12", "x = 4"], "why": {"x = −4": "−12 ÷ (−3) is positive.", "x = −12": "That is −3x. Divide by −3 to find x.", "x = 4/3": "Subtract 4 from −8 first, not add it."}}, {"n": 4, "q": "Solve: 0.4x − 1.2 = 2.8", "lv": 5, "hint": "Add 1.2. Then divide by 0.4.", "ans": "10"}]}, {"title": "B. Equations with Parentheses", "std": "NC.7.EE.4", "hint": "Distribute, or divide by the outside number first.", "probs": [{"n": 1, "q": "Solve: 3(x − 4) = 18", "lv": 3, "hint": "Divide by 3: x − 4 = 6.", "ans": "10"}, {"n": 2, "q": "Solve: 6 = −2(x + 1)", "lv": 4, "hint": "Divide both sides by −2.", "ans": "x = −4", "choices": ["x = −2", "x = 2", "x = −4", "x = −3.5"], "why": {"x = −2": "After dividing, −3 = x + 1. Undo + 1 by SUBTRACTING 1.", "x = 2": "6 ÷ (−2) is negative.", "x = −3.5": "You multiplied −2 by x but not by 1."}}, {"n": 3, "q": "Solve: <span class=\"fr\"><span>1</span><span>2</span></span>(x + 6) = 10", "lv": 5, "hint": "Multiply both sides by 2: x + 6 = 20.", "ans": "14"}]}, {"title": "C. Word Problems", "std": "NC.7.EE.3", "hint": "Rate × variable + one-time amount = total.", "probs": [{"n": 1, "q": "Jo ran 4 miles, then biked 3.5 miles each day for d days. She went 25 miles in all. How many days did she bike?", "lv": 3, "hint": "3.5d + 4 = 25", "ans": "6"}, {"n": 2, "q": "A phone plan is $15 per month. The phone costs $40 once. Sam paid $145 in all. Which equation fits? (m = months)", "lv": 4, "hint": "Monthly cost × m + one-time cost = total.", "ans": "15m + 40 = 145", "choices": ["15(m + 40) = 145", "40m + 15 = 145", "15m − 40 = 145", "15m + 40 = 145"], "why": {"40m + 15 = 145": "The MONTHLY cost goes with m.", "15(m + 40) = 145": "That charges $15 on the $40 too. The phone is paid once.", "15m − 40 = 145": "The phone adds to the cost."}}, {"n": 3, "q": "Solve: <span class=\"fr\"><span>2</span><span>5</span></span>x − 3 = 5", "lv": 4, "hint": "Add 3. Then multiply by 5/2.", "ans": "20"}, {"n": 4, "q": "A rectangle's length is 3 more than twice its width. The perimeter is 54. What is the width?", "lv": 5, "hint": "Length = 2w + 3. Perimeter: 2(2w + 3) + 2w = 54.", "ans": "8"}]}, {"title": "D. Inequalities", "std": "NC.7.EE.4", "hint": "Flip the sign when you multiply or divide by a negative.", "probs": [{"n": 1, "q": "Solve: x/2 − 3 ≥ 1. The answer is x ≥ □. What number goes in the box?", "lv": 3, "hint": "Add 3. Then multiply by 2.", "ans": "8"}, {"n": 2, "q": "Solve: 9 − 5x > 24", "lv": 4, "hint": "Subtract 9. Then divide by −5 and flip.", "ans": "x < −3", "choices": ["x < 3", "x > 3", "x < −3", "x > −3"], "why": {"x > −3": "You divided by −5. Did you flip the sign?", "x < 3": "15 ÷ (−5) is negative.", "x > 3": "Two mistakes: the sign of the number and the flip."}}, {"n": 3, "q": "Which inequality matches the graph?<div class=\"pr-figwrap\"><svg viewBox=\"0 0 520 86\" width=\"520\" height=\"86\" role=\"img\" aria-label=\"closed circle at −1, shaded right\" style=\"max-width:100%;height:auto\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"context-stroke\"/></marker></defs><line x1=\"16.0\" y1=\"46.0\" x2=\"504.0\" y2=\"46.0\" stroke=\"#3E2414\" stroke-width=\"2.2\"/><path d=\"M14,46 l-9,-6 v12z M506,46 l9,-6 v12z\" fill=\"#3E2414\"/><line x1=\"30.0\" y1=\"39.0\" x2=\"30.0\" y2=\"53.0\" stroke=\"#3E2414\" stroke-width=\"1.6\"/><text x=\"30.0\" y=\"71.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#7D6A58\" font-family=\"JetBrains Mono,ui-monospace,monospace\">−4</text><line x1=\"87.5\" y1=\"39.0\" x2=\"87.5\" y2=\"53.0\" stroke=\"#3E2414\" stroke-width=\"1.6\"/><text x=\"87.5\" y=\"71.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#7D6A58\" font-family=\"JetBrains Mono,ui-monospace,monospace\">−3</text><line x1=\"145.0\" y1=\"39.0\" x2=\"145.0\" y2=\"53.0\" stroke=\"#3E2414\" stroke-width=\"1.6\"/><text x=\"145.0\" y=\"71.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#7D6A58\" font-family=\"JetBrains Mono,ui-monospace,monospace\">−2</text><line x1=\"202.5\" y1=\"39.0\" x2=\"202.5\" y2=\"53.0\" stroke=\"#3E2414\" stroke-width=\"1.6\"/><text x=\"202.5\" y=\"71.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#7D6A58\" font-family=\"JetBrains Mono,ui-monospace,monospace\">−1</text><line x1=\"260.0\" y1=\"39.0\" x2=\"260.0\" y2=\"53.0\" stroke=\"#3E2414\" stroke-width=\"1.6\"/><text x=\"260.0\" y=\"71.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#7D6A58\" font-family=\"JetBrains Mono,ui-monospace,monospace\">0</text><line x1=\"317.5\" y1=\"39.0\" x2=\"317.5\" y2=\"53.0\" stroke=\"#3E2414\" stroke-width=\"1.6\"/><text x=\"317.5\" y=\"71.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#7D6A58\" font-family=\"JetBrains Mono,ui-monospace,monospace\">1</text><line x1=\"375.0\" y1=\"39.0\" x2=\"375.0\" y2=\"53.0\" stroke=\"#3E2414\" stroke-width=\"1.6\"/><text x=\"375.0\" y=\"71.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#7D6A58\" font-family=\"JetBrains Mono,ui-monospace,monospace\">2</text><line x1=\"432.5\" y1=\"39.0\" x2=\"432.5\" y2=\"53.0\" stroke=\"#3E2414\" stroke-width=\"1.6\"/><text x=\"432.5\" y=\"71.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#7D6A58\" font-family=\"JetBrains Mono,ui-monospace,monospace\">3</text><line x1=\"490.0\" y1=\"39.0\" x2=\"490.0\" y2=\"53.0\" stroke=\"#3E2414\" stroke-width=\"1.6\"/><text x=\"490.0\" y=\"71.0\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#7D6A58\" font-family=\"JetBrains Mono,ui-monospace,monospace\">4</text><line x1=\"202.5\" y1=\"46\" x2=\"502.0\" y2=\"46\" stroke=\"#B4541C\" stroke-width=\"6\" stroke-linecap=\"round\"/><path d=\"M510.0,46 l-12,-9 v18z\" fill=\"#B4541C\"/><circle cx=\"202.5\" cy=\"46\" r=\"8\" fill=\"#B4541C\" stroke=\"#B4541C\" stroke-width=\"3\"/></svg></div>", "lv": 4, "hint": "Closed or open circle? Which way is the shading?", "ans": "x ≥ −1", "choices": ["x ≤ −1", "x > −1", "x ≥ −1", "x ≥ 1"], "why": {"x > −1": "The circle is filled in, so −1 IS a solution.", "x ≤ −1": "The shading goes right, toward bigger numbers.", "x ≥ 1": "Look again at where the circle is: left of 0."}}, {"n": 4, "q": "Which number is NOT a solution of 3x − 7 < 8?", "lv": 5, "hint": "Solve: x < ?. Or test each number.", "ans": "5", "choices": ["−2", "0", "4.9", "5"], "why": {"4.9": "3(4.9) − 7 = 7.7, which is less than 8. It works.", "0": "3(0) − 7 = −7, which is less than 8. It works.", "−2": "3(−2) − 7 = −13, which is less than 8. It works."}}]}, {"title": "E. Inequality Word Problems", "std": "NC.7.EE.4", "hint": "Solve, then round to fit the story.", "probs": [{"n": 1, "q": "You have $50. A pizza costs $12 and delivery is $8. What is the greatest number of pizzas you can order?", "lv": 3, "hint": "12p + 8 ≤ 50", "ans": "3"}, {"n": 2, "q": "A team needs at least 24 points to win the prize. Which sign belongs in \"points □ 24\"?", "lv": 4, "hint": "\"At least\" means that much or more.", "ans": "≥", "choices": ["<", ">", "≤", "≥"], "why": {">": "\"At least 24\" includes 24 itself.", "≤": "That means at most 24.", "<": "That means fewer than 24."}}, {"n": 3, "q": "Kai earns $9 an hour and already has $35. He wants MORE than $200. What is the fewest whole hours he must work?", "lv": 5, "hint": "9h + 35 > 200. Is 18 hours enough?", "ans": "19"}]}]}};</script>
