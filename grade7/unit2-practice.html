<script>window.PRACTICE = {"unit": "7-2", "data": {"title": "Unit 2 Practice — Expressions", "sub": "Like terms · Distribute · Factor · Add & subtract · Meaning", "secs": [{"title": "A. Combine Like Terms", "std": "NC.7.EE.1", "hint": "Like terms have the same variable part. Add or subtract their coefficients.", "probs": [{"n": 1, "q": "Simplify: 9x − 2x + 4. What is the coefficient of x?", "lv": 3, "hint": "9 − 2", "ans": "7"}, {"n": 2, "q": "Simplify: −3y + 7 + 5y − 10. What is the constant?", "lv": 3, "hint": "7 − 10", "ans": "-3"}, {"n": 3, "q": "Simplify: 0.6n − 1.2 + 0.9n + 3", "lv": 4, "hint": "n-terms: 0.6n + 0.9n. Constants: −1.2 + 3.", "ans": "1.5n + 1.8", "choices": ["1.5n + 1.8", "3.3n", "0.3n + 1.8", "1.5n − 4.2"], "why": {"1.5n − 4.2": "Keep the sign of each constant: −1.2 + 3 = 1.8.", "0.3n + 1.8": "Add the n-terms: 0.6 + 0.9.", "3.3n": "n-terms and constants are not like terms."}}, {"n": 4, "q": "Simplify: <span class=\"fr\"><span>2</span><span>5</span></span>k − 3 − k + <span class=\"fr\"><span>1</span><span>2</span></span>", "lv": 5, "hint": "−k is −1k. 2/5 − 5/5 = ?", "ans": "−3/5k − 21/2", "choices": ["−3/5k − 21/2", "3/5k − 21/2", "7/5k − 21/2", "−3/5k − 31/2"], "why": {"3/5k − 21/2": "2/5 − 1 is negative.", "−3/5k − 31/2": "−3 + 1/2 = −2 1/2.", "7/5k − 21/2": "−k means subtract 1k."}}]}, {"title": "B. Distributive Property", "std": "NC.7.EE.1", "hint": "Multiply the outside number by every term inside. A negative outside changes every sign.", "probs": [{"n": 1, "q": "Expand 7(x − 3). What is the constant?", "lv": 3, "hint": "7 × (−3)", "ans": "-21"}, {"n": 2, "q": "Expand: −5(2x + 4)", "lv": 4, "hint": "−5 × 2x and −5 × 4", "ans": "−10x − 20", "choices": ["10x − 20", "−10x − 20", "−10x + 20", "−10x + 4"], "why": {"−10x + 20": "−5 × 4 is negative.", "10x − 20": "−5 × 2x is negative.", "−10x + 4": "Multiply the 4 by −5 too."}}, {"n": 3, "q": "Expand <span class=\"fr\"><span>3</span><span>4</span></span>(12x − 8). What is the coefficient of x?", "lv": 4, "hint": "3/4 × 12", "ans": "9"}, {"n": 4, "q": "Simplify: 4(x + 2) − 3(x − 1)", "lv": 5, "hint": "4x + 8 − 3x + 3", "ans": "x + 11", "choices": ["x + 7", "x + 11", "x + 5", "7x + 11"], "why": {"x + 5": "−3 × (−1) = +3, so 8 + 3.", "x + 7": "Check both constants. What is 4 × 2? What is −3 × (−1)? Add them.", "7x + 11": "You added the x-terms. The second part is minus 3(x − 1), so subtract: 4x − 3x."}}]}, {"title": "C. Factor", "std": "NC.7.EE.1", "hint": "Find the GCF, put it outside, divide each term by it. Check by distributing.", "probs": [{"n": 1, "q": "What is the GCF of 16x and 40?", "lv": 3, "hint": "Biggest number that divides 16 and 40.", "ans": "8"}, {"n": 2, "q": "Factor: 21x − 14", "lv": 4, "hint": "GCF of 21 and 14.", "ans": "7(3x − 2)", "choices": ["7(3x − 2)", "7(3x − 14)", "3(7x − 14)", "14(x − 1)"], "why": {"7(3x − 14)": "You took out the 7 but left −14 as it was. Divide every term by the GCF. What is −14 ÷ 7?", "3(7x − 14)": "3 does not divide 14.", "14(x − 1)": "14 does not divide 21x."}}, {"n": 3, "q": "Factor with a negative GCF: −10x − 25 = −5(2x + □). What number goes in the box?", "lv": 5, "hint": "−25 ÷ (−5)", "ans": "5"}]}, {"title": "D. Add and Subtract Expressions", "std": "NC.7.EE.1", "hint": "Subtracting an expression: change the sign of EVERY term in it, then combine.", "probs": [{"n": 1, "q": "Add: (2x + 7) + (5x − 3). What is the coefficient of x?", "lv": 3, "hint": "2x + 5x", "ans": "7"}, {"n": 2, "q": "Subtract: (9m − 4) − (2m + 6)", "lv": 4, "hint": "9m − 4 − 2m − 6", "ans": "7m − 10", "choices": ["7m − 10", "11m − 10", "7m + 2", "7m − 2"], "why": {"7m + 2": "−(2m + 6) = −2m − 6, so −4 − 6.", "11m − 10": "You added the m-terms. The minus sign goes to 2m too: 9m − 2m.", "7m − 2": "Subtract 6: −4 − 6 = −10."}}, {"n": 3, "q": "The perimeter of a triangle is 12x + 5. Two sides are 3x + 1 and 4x − 2. Which is the third side?", "lv": 5, "hint": "12x + 5 − (3x + 1) − (4x − 2)", "ans": "5x + 6", "choices": ["5x + 4", "19x + 4", "5x + 6", "5x + 8"], "why": {"5x + 4": "Subtracting 4x − 2 means you ADD 2. Redo the constants: 5 − 1, then subtract −2.", "19x + 4": "Subtract the two sides from the perimeter, do not add them.", "5x + 8": "You added the 1 instead of subtracting it. Redo the constants: 5 − 1, then subtract −2."}}]}, {"title": "E. Expressions with Meaning", "std": "NC.7.EE.2", "hint": "Rewrite to see the story: p + 0.1p = 1.1p means 110% of p.", "probs": [{"n": 1, "q": "A price p goes up 15%. The new price is p + 0.15p = □p. What goes in the box?", "lv": 3, "hint": "1 + 0.15", "ans": "1.15"}, {"n": 2, "q": "Which is equivalent to b − 0.4b?", "lv": 4, "hint": "1 − 0.4", "ans": "0.6b", "choices": ["0.6b", "0.4b", "b − 0.4", "1.4b"], "why": {"0.4b": "b − 0.4b is 1b − 0.4b.", "b − 0.4": "The 0.4 is 0.4 OF b.", "1.4b": "You added. b − 0.4b means take 0.4b away from 1b."}}, {"n": 3, "q": "Sam earns $10 an hour plus a $3 bonus each hour on weekends. Which expression shows his pay for h weekend hours, and what does it show?", "lv": 5, "hint": "10h + 3h = ?", "ans": "13h: he earns $13 for each weekend hour", "choices": ["10h + 3: he earns a $3 bonus once", "10 + 3h: he earns $10 once", "13h: he earns $13 for each weekend hour", "3h: he only earns the bonus"], "why": {"10h + 3: he earns a $3 bonus once": "The bonus is each hour, so it is 3h.", "3h: he only earns the bonus": "He also earns $10 each hour.", "10 + 3h: he earns $10 once": "The $10 is each hour too."}}]}]}};</script>
