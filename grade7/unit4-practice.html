<script>window.PRACTICE = {"unit": "7-4", "data": {"title": "Unit 4 Practice — Proportional Relationships", "sub": "Unit rates · Tables · Graphs · y = kx · Problems", "secs": [{"title": "A. Unit Rates with Fractions", "std": "NC.7.RP.1", "hint": "Divide the first amount by the second. Divide fractions by multiplying by the reciprocal.", "probs": [{"n": 1, "q": "A faucet fills 18 liters in 3 minutes. How many liters per minute?", "lv": 3, "hint": "18 ÷ 3", "ans": "6"}, {"n": 2, "q": "A turtle walks 1/4 mile in 1/6 hour. How many miles per hour?", "lv": 4, "hint": "(1/4) ÷ (1/6) = (1/4) × 6.", "ans": "1 1/2 miles per hour", "choices": ["1/24 mile per hour", "2/3 mile per hour", "1 1/2 miles per hour", "4 miles per hour"], "why": {"2/3 mile per hour": "That is hours ÷ miles. Put miles on top.", "1/24 mile per hour": "You multiplied. A rate DIVIDES.", "4 miles per hour": "Divide by 1/6 means × 6, then multiply by 1/4 too."}}, {"n": 3, "q": "A 3/4 lb bag of trail mix costs $3. What is the price per pound in dollars?", "lv": 4, "hint": "3 ÷ (3/4)", "ans": "4"}, {"n": 4, "q": "Jay types 2/3 of a page in 1/6 hour. Kim types 1 1/2 pages in 1/2 hour. How many MORE pages per hour does the faster typist type?", "lv": 5, "hint": "Jay: (2/3) ÷ (1/6). Kim: (3/2) ÷ (1/2).", "ans": "1"}]}, {"title": "B. Proportional Tables", "std": "NC.7.RP.2", "hint": "Proportional: y ÷ x is the same in every row. That value is k.", "probs": [{"n": 1, "q": "What is k for this proportional table?<div class=\"pr-figwrap\"><table class=\"data\"><tr><th>x</th><th>y</th></tr><tr><td>4</td><td>28</td></tr><tr><td>6</td><td>42</td></tr><tr><td>9</td><td>63</td></tr></table></div>", "lv": 3, "hint": "y ÷ x", "ans": "7"}, {"n": 2, "q": "Is the table proportional?<div class=\"pr-figwrap\"><table class=\"data\"><tr><th>Pizzas</th><th>Cost ($)</th></tr><tr><td>1</td><td>12</td></tr><tr><td>2</td><td>22</td></tr><tr><td>3</td><td>32</td></tr></table></div>", "lv": 4, "hint": "Find cost ÷ pizzas in every row.", "ans": "No, because 22 ÷ 2 is not 12.", "choices": ["No, because pizzas are whole numbers.", "Yes, the cost goes up by 10 each time.", "No, because 22 ÷ 2 is not 12.", "Yes, k = 12."], "why": {"Yes, k = 12.": "Check the second row: 22 ÷ 2.", "Yes, the cost goes up by 10 each time.": "Going up by the same amount is not enough. y ÷ x must stay the same.", "No, because pizzas are whole numbers.": "Whole numbers can be proportional. Check y ÷ x."}}, {"n": 3, "q": "In a proportional table, 5 shirts cost $60. How much do 12 shirts cost (in dollars)?", "lv": 5, "hint": "k = 60 ÷ 5.", "ans": "144"}]}, {"title": "C. Proportional Graphs", "std": "NC.7.RP.2", "hint": "A straight line through the origin. (1, r) shows the unit rate.", "probs": [{"n": 1, "q": "The line goes through (0, 0) and (3, 18). What is the unit rate?<div class=\"pr-figwrap\"><svg viewBox=\"0 0 300 260\" width=\"300\" height=\"260\" role=\"img\" aria-label=\"line through (0, 0) and (3, 18)\" style=\"max-width:100%;height:auto\"><defs><marker id=\"ah\" viewBox=\"0 0 10 10\" refX=\"8\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"context-stroke\"/></marker></defs><line x1=\"44.0\" y1=\"224.0\" x2=\"44.0\" y2=\"14.0\" stroke=\"#E9DCC4\" stroke-width=\"1\"/><text x=\"44.0\" y=\"240.0\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\" fill=\"#7D6A58\" font-family=\"JetBrains Mono,ui-monospace,monospace\">0</text><line x1=\"104.5\" y1=\"224.0\" x2=\"104.5\" y2=\"14.0\" stroke=\"#E9DCC4\" stroke-width=\"1\"/><text x=\"104.5\" y=\"240.0\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\" fill=\"#7D6A58\" font-family=\"JetBrains Mono,ui-monospace,monospace\">1</text><line x1=\"165.0\" y1=\"224.0\" x2=\"165.0\" y2=\"14.0\" stroke=\"#E9DCC4\" stroke-width=\"1\"/><text x=\"165.0\" y=\"240.0\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"600\" fill=\"#7D6A58\" font-family=\"JetBrains Mono,ui-monospace,monospace\">2</text \" stroke-width=\"2\"/><text x=\"165.0\" y=\"256.0\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"600\" fill=\"#3E2414\" font-family=\"Inter,system-ui,sans-serif\">x</text><text x=\"12\" y=\"112\" font-size=\"12\" font-weight=\"600\" fill=\"#3E2414\" font-family=\"Inter,sans-serif\" transform=\"rotate(-90 12 112)\" text-anchor=\"middle\">y</text><line x1=\"44.0\" y1=\"224.0\" x2=\"286.0\" y2=\"14.0\" stroke=\"#B4541C\" stroke-width=\"2.5\"/><circle cx=\"225.5\" cy=\"66.5\" r=\"5\" fill=\"#3E2414\"/><text x=\"233.5\" y=\"58.5\" text-anchor=\"start\" font-size=\"12\" font-weight=\"600\" fill=\"#B4541C\" font-family=\"JetBrains Mono,ui-monospace,monospace\">(3, 18)</text></svg></div>", "lv": 3, "hint": "y ÷ x", "ans": "6"}, {"n": 2, "q": "What does (0, 0) mean on a graph of tickets (x) and cost (y)?", "lv": 4, "hint": "x = 0 tickets, y = 0 dollars.", "ans": "0 tickets cost $0.", "choices": ["Each ticket costs $0.", "0 tickets cost $0.", "The tickets are free after the first one.", "The graph starts at 1 ticket."], "why": {"Each ticket costs $0.": "The unit rate is the y at x = 1, not at x = 0.", "The tickets are free after the first one.": "Every point on the line has the same unit rate.", "The graph starts at 1 ticket.": "(0, 0) is a point on the graph, so it starts at 0."}}, {"n": 3, "q": "A graph of y = kx goes through (8, 6). What is the y-value at x = 1? (Type a decimal or a fraction.)", "lv": 5, "hint": "k = 6 ÷ 8.", "ans": "3/4", "alt": ["0.75"]}]}, {"title": "D. Equations y = kx", "std": "NC.7.RP.2", "hint": "k = y ÷ x. Then y = kx.", "probs": [{"n": 1, "q": "Rope costs $1.25 per foot. Using y = 1.25x, what does 20 feet cost (in dollars)?", "lv": 3, "hint": "1.25 × 20", "ans": "25"}, {"n": 2, "q": "Which equation fits: 4 hours of work pays $54?", "lv": 4, "hint": "k = 54 ÷ 4.", "ans": "y = 13.5x", "choices": ["y = 13.5x", "y = 0.074x", "y = 4x", "y = 54x"], "why": {"y = 4x": "4 is the number of hours. k = dollars ÷ hours.", "y = 54x": "54 is the pay for 4 hours, not 1 hour.", "y = 0.074x": "That is hours ÷ dollars. Use dollars ÷ hours."}}, {"n": 3, "q": "y = <span class=\"fr\"><span>5</span><span>2</span></span>x. What is x when y = 35?", "lv": 5, "hint": "35 ÷ (5/2) = 35 × 2/5.", "ans": "14"}]}, {"title": "E. Solve Proportional Problems", "std": "NC.7.RP.2", "hint": "Find the unit rate, then multiply. Check that it is reasonable.", "probs": [{"n": 1, "q": "A car goes 88 miles on 4 gallons. How many miles on 11 gallons?", "lv": 3, "hint": "88 ÷ 4 = miles per gallon.", "ans": "242"}, {"n": 2, "q": "Ms. Diaz drives 1/2 hour to go 1/3 of the way to the beach. At the same rate, how many hours does the WHOLE trip take?", "lv": 4, "hint": "Hours ÷ fraction of the trip: (1/2) ÷ (1/3).", "ans": "3/2", "alt": ["1.5"]}, {"n": 3, "q": "Gym A: $90 for 6 visits. Gym B: $126 for 9 visits. How many dollars less per visit is the cheaper gym?", "lv": 5, "hint": "Find dollars per visit for each.", "ans": "1"}]}]}};</script>
