<script>window.PRACTICE = {"unit": "7-9", "data": {"title": "Unit 9 Practice — Probability", "sub": "Probability scale · Experiments · Theory · Compound events · Simulations", "secs": [{"title": "A. The Probability Scale", "std": "NC.7.SP.5", "hint": "0 = impossible, 1/2 = as likely as not, 1 = certain.", "probs": [{"n": 1, "q": "A bag has 5 red and 0 blue marbles. What is P(blue)?", "lv": 3, "hint": "There are no blue marbles.", "ans": "0"}, {"n": 2, "q": "Which number can NOT be a probability?", "lv": 4, "hint": "Probabilities go from 0 to 1.", "ans": "4/3", "choices": ["1", "0.99", "0", "4/3"], "why": {"0": "0 is a probability: impossible.", "0.99": "0.99 is between 0 and 1: very likely.", "1": "1 is a probability: it means certain."}}]}, {"title": "B. Experimental Probability", "std": "NC.7.SP.6", "hint": "times it happened ÷ trials. Predict by multiplying.", "probs": [{"n": 1, "q": "A tack landed point up 12 times in 40 drops. What is the experimental P(point up) as a decimal?", "lv": 3, "hint": "12 ÷ 40", "ans": "0.3"}, {"n": 2, "q": "Leo made 3 of every 5 shots. About how many will he make in 60 shots?", "lv": 4, "hint": "(3/5) × 60", "ans": "36", "choices": ["12", "36", "180", "24"], "why": {"24": "That is the number of misses. Use 3/5.", "12": "60 ÷ 5 = 12 groups of 5. Each group has 3 makes.", "180": "You multiplied 60 × 3. Use 3/5 of 60."}}, {"n": 3, "q": "A cube was rolled 120 times. It showed 1 thirty-five times. Theory says 1/6. How many more than theory predicts?", "lv": 5, "hint": "(1/6) × 120 = 20", "ans": "15"}]}, {"title": "C. Theoretical Probability", "std": "NC.7.SP.7", "hint": "favorable ÷ total, when outcomes are equally likely.", "probs": [{"n": 1, "q": "Pick a letter at random from PROBABILITY (11 letters). What is P(B)? (Type a fraction.)", "lv": 3, "hint": "Count the Bs.", "ans": "2/11"}, {"n": 2, "q": "P(win) = 3/8. What is P(not win)?", "lv": 4, "hint": "1 − 3/8", "ans": "5/8", "choices": ["3/8", "8/3", "1/8", "5/8"], "why": {"3/8": "That is P(win). Not winning is everything else.", "8/3": "A probability cannot be more than 1.", "1/8": "Subtract 3/8 from 1 = 8/8."}}, {"n": 3, "q": "A bag has 6 red, 4 blue and some green marbles. P(green) = 1/3. How many green marbles?", "lv": 5, "hint": "Red + blue = 10 = 2/3 of the bag.", "ans": "5"}]}, {"title": "D. Compound Events", "std": "NC.7.SP.8", "hint": "Build the sample space. Count. Divide.", "probs": [{"n": 1, "q": "Flip a coin and spin a 3-part spinner (A, B, C). How many outcomes?", "lv": 3, "hint": "2 × 3", "ans": "6"}, {"n": 2, "q": "Roll two number cubes. What is P(sum is 7)?", "lv": 4, "hint": "List the pairs that add to 7.", "ans": "1/6", "choices": ["1/6", "1/36", "1/12", "7/36"], "why": {"1/12": "Count every pair: (1,6) and (6,1) are both outcomes.", "7/36": "The sum is 7, but there are 6 pairs that make it.", "1/36": "More than one pair adds to 7."}}, {"n": 3, "q": "Flip 4 coins. How many outcomes have exactly 3 heads?", "lv": 5, "hint": "The one tail can be in any of the 4 spots.", "ans": "4"}]}, {"title": "E. Simulations", "std": "NC.7.SP.8", "hint": "The tool must match the real chance.", "probs": [{"n": 1, "q": "In 40 trials of a simulation, 10 trials needed 3 or more boxes. What is the estimated probability, as a decimal?", "lv": 3, "hint": "10 ÷ 40", "ans": "0.25"}, {"n": 2, "q": "A player makes 1 out of 2 free throws. Which tool fits?", "lv": 4, "hint": "Which tool has a 1/2 chance with one side?", "ans": "a coin", "choices": ["a number cube", "a coin", "a 5-part spinner", "a 10-sided number cube"], "why": {"a number cube": "Each side is a 1/6 chance, not 1/2.", "a 5-part spinner": "Each part is 1/5. 1/2 can not be made with 5 equal parts.", "a 10-sided number cube": "It works only if you use 5 sides. A simpler tool has exactly 1/2."}}]}]}};</script>
